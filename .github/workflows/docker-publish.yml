# Publica la imagen Docker de Taller3D Panel en GitHub (ghcr.io/iaonlineapps/taller3dpanel)
# para PC (amd64), Raspberry Pi 4/5 (arm64) y Raspberry Pi de 32 bits (arm/v7).
# Se lanza al crear una versión (etiqueta v1.2.3) o a mano desde Actions (Run workflow).
name: Publicar imagen Docker

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (por ejemplo 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Taller3D Panel
            org.opencontainers.image.description=Gestión de tu taller de impresión 3D: stock, ventas, clientes, gastos, presupuestos y servicio informático
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TALLER3D_VERSION=${{ inputs.version || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
