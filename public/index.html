<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taller3D Panel</title>
<meta name="theme-color" content="#5750f1">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="vendor/qrcode.js"></script>
<script src="vendor/JsBarcode.all.min.js"></script>
<script src="vendor/jsQR.js"></script>
<style>
/* VOICE: panel de gestión personal, limpio y tranquilo, cifras grandes y claras
   IDEA: el cuaderno de cuentas del taller convertido en panel de control
   PICTURE: la gráfica de ingresos contra gastos y la galería de piezas con su stock
   COLOUR and TYPE: índigo de marca, verde ingresos, coral gastos; Inter + JetBrains Mono para tickets
   LAYOUT: menú lateral agrupado + barra superior; en móvil, barra inferior con "Más" */
:root{color-scheme:light;--bg:#f3f4f8;--card:#fff;--ink:#111427;--mute:#646b80;--line:#e6e8ef;--soft:#f1f2f8;--side:#fff;--pri:#5750f1;--pri2:#eeedfe;--btn:#5750f1;--inc:#12a150;--exp:#ef4b4b;--warn:#c2700a;--cy:#06b6d4;--or:#fb6b2b}
:root.dark{color-scheme:dark;--bg:#0b0e1a;--card:#141a2e;--ink:#eceef7;--mute:#99a1b8;--line:#242b44;--soft:#1b2238;--side:#10152a;--pri:#7b75ff;--pri2:#232250;--inc:#34d399;--exp:#ff7b7b;--warn:#fbbf24}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(24px,2.6vw,30px)}h2{font-size:17px}h3{font-size:15px}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* Estructura */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
aside.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:20px 14px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:2px 10px 18px}
.logo b{color:var(--pri)}
.grp{font-size:12px;color:var(--mute);font-weight:600;padding:16px 12px 6px}
.side button.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mute);font-weight:500;min-height:44px;text-align:left;width:100%}
.side button.nv:hover{background:var(--soft);color:var(--ink)}
.side button.nv.on{background:var(--pri2);color:var(--pri);font-weight:600}
.side .cnt{margin-left:auto;font-size:12px;background:var(--exp);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}
.dbcard{margin-top:auto;background:var(--soft);border-radius:14px;padding:14px;font-size:13px;color:var(--mute);display:flex;gap:10px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none}.dot.ok{background:var(--inc)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px clamp(14px,2.4vw,28px);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.srch{position:relative;flex:1;max-width:460px}
.srch input{padding-left:40px;background:var(--soft);border-color:transparent}
.srch>svg{position:absolute;left:12px;top:13px;color:var(--mute)}
.res{position:absolute;top:52px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px -20px rgba(10,15,40,.35);padding:6px;display:none;max-height:60vh;overflow:auto}
.res.show{display:block}
.res button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:10px;text-align:left}
.res button:hover,.res button.act{background:var(--soft)}
.res small{color:var(--mute);margin-left:auto;font-size:12px}
.tb{display:flex;gap:8px;margin-left:auto;align-items:center}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:var(--card);color:var(--ink);position:relative}
.ib .pip{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--exp)}
.me{display:flex;align-items:center;gap:10px;padding:3px 8px 3px 4px;font-weight:600;font-size:14px;border-radius:999px;color:var(--ink)}.me:hover{background:var(--soft)}
.av{width:38px;height:38px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.burger{display:none}
main{padding:clamp(16px,2.4vw,28px);display:flex;flex-direction:column;gap:20px;max-width:1500px;width:100%;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sub{color:var(--mute);font-size:14px;margin-top:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.btn{background:var(--btn);color:#fff;padding:10px 18px;border-radius:11px;font-weight:600;min-height:44px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.gh{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sf{background:var(--pri2);color:var(--pri)}
.btn.rd{background:none;color:var(--exp);border:1px solid var(--line)}
.btn.big{width:100%;font-size:17px;padding:15px;min-height:54px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--card);min-height:46px}
label{font-size:13px;color:var(--mute);display:grid;gap:5px;font-weight:500}
.tabs{display:inline-flex;background:var(--soft);border-radius:11px;padding:4px;gap:2px;flex-wrap:wrap}
.tabs button{padding:7px 13px;border-radius:8px;font-size:14px;font-weight:600;color:var(--mute);min-height:36px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;min-height:40px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--pri2);color:var(--pri);white-space:nowrap;font-weight:600;font-style:normal;display:inline-block}
.tag.g{background:color-mix(in srgb,var(--inc) 15%,transparent);color:var(--inc)}.tag.r{background:color-mix(in srgb,var(--exp) 15%,transparent);color:var(--exp)}.tag.y{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.up{color:var(--inc)}.dn{color:var(--exp)}
.empty{color:var(--mute);text-align:center;padding:28px 10px}
.note{font-size:13px;color:var(--mute)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.kpi .l{font-size:12.5px;font-weight:600;color:var(--mute)}
.kpi .v{font-size:clamp(22px,2.2vw,28px);font-weight:800;white-space:nowrap;letter-spacing:-.02em}
.kpi .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;grid-row:span 2}
.kpi .d{grid-column:1/-1;font-size:13px;color:var(--mute)}.kpi .d b{font-weight:600}
/* Ticker */
.tick{overflow:hidden;padding:0;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tick .tr{display:flex;width:max-content;animation:tk 50s linear infinite}
.tick:hover .tr{animation-play-state:paused}
.tick .ti{display:flex;align-items:center;gap:10px;padding:16px 22px;border-right:1px solid var(--line);white-space:nowrap;font-size:14px}
.tick .ti b{font-weight:600}
.tick .mini{width:26px;height:26px;border-radius:8px;overflow:hidden;flex:none}
@keyframes tk{to{transform:translateX(-50%)}}
/* Rejillas del panel */
.g21{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:16px}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.85fr);gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.big{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.leg{display:flex;gap:16px;font-size:13px;color:var(--mute);flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.fig{position:relative;height:300px;margin-top:8px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);padding:8px 11px;border-radius:10px;font-size:12.5px;line-height:1.45;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.lst{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .th{width:44px;height:44px;border-radius:12px;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-weight:700}
.li b{display:block;font-weight:600}.li small{color:var(--mute);font-size:13px}
.li .rt{text-align:right;white-space:nowrap}.li .rt b{font-weight:700}
.donut{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:center}
.donut svg{width:170px;height:170px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar .h{display:flex;justify-content:space-between;gap:8px;font-size:14px}.bar .h span:last-child{font-weight:600;white-space:nowrap}
.trk{height:9px;border-radius:6px;background:var(--soft);margin-top:6px;overflow:hidden}.trk i{display:block;height:100%;border-radius:6px;background:var(--pri)}
/* Tablas */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12.5px;color:var(--mute);font-weight:600;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.ck{cursor:pointer}tr.ck:hover td{background:var(--soft)}
.pc{display:flex;align-items:center;gap:10px}.pc .th{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:none;background:var(--soft)}
.th img,.th svg,.ph2 img,.ph2 svg{width:100%;height:100%;object-fit:cover;display:block}
.spk{width:96px;height:30px;display:block;margin-left:auto}
.scroll{overflow-x:auto}
/* Piezas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.it{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.it:hover{transform:translateY(-3px);box-shadow:0 16px 34px -20px rgba(30,30,90,.45)}
.ph2{aspect-ratio:1;background:var(--soft);position:relative;overflow:hidden}
.ph2 .tag{position:absolute;top:10px;left:10px;box-shadow:0 2px 8px rgba(0,0,0,.12);background:var(--card)}
.it .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.it b{font-weight:600;line-height:1.3}.it .mt{font-size:13px;color:var(--mute)}
.it .pr{margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;align-items:center}
.it .pr span{font-size:18px;font-weight:800;white-space:nowrap}
.plus{width:36px;height:36px;border-radius:11px;background:var(--btn);color:#fff;font-size:22px;display:grid;place-items:center;flex:none}
.it.off{opacity:.5}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-left:4px solid var(--pri)}
.sm .l{font-size:12px;font-weight:600;color:var(--mute)}.sm .v{font-size:22px;font-weight:800;white-space:nowrap}
/* Vender */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.scan{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.scan input{flex:1 1 200px}
.opts{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--mute);padding:0 4px}
.opts label{display:flex;flex-direction:row;align-items:center;gap:7px;font-size:13.5px}
.opts input{width:18px;height:18px;min-height:0}
.last{background:color-mix(in srgb,var(--inc) 12%,var(--card));border:1px solid color-mix(in srgb,var(--inc) 30%,transparent);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ticket{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
.lines{display:flex;flex-direction:column;max-height:36vh;overflow:auto}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.ln .n{font-weight:600;font-size:14.5px}.ln .u{font-size:12.5px;color:var(--mute)}
.qty{display:flex;align-items:center;background:var(--soft);border-radius:10px}
.qty button{width:34px;height:36px;font-size:19px;font-weight:700;color:var(--pri)}
.qty span{min-width:24px;text-align:center;font-weight:700}
.ln .t{font-weight:700;white-space:nowrap;text-align:right;min-width:66px}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:6px}
.pay button{padding:9px 2px;border-radius:11px;border:1px solid var(--line);font-weight:600;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
.pay button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tot{display:flex;justify-content:space-between;align-items:baseline}.tot b{font-size:32px;font-weight:800;white-space:nowrap;letter-spacing:-.02em}
.mcart{display:none}
/* Diseños */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{background:var(--soft);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.col h2{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:2px 4px}
.dz{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:14px;text-align:left;background:var(--card);border:1px solid var(--line)}
.dz .ph2{border-radius:10px}.dz b{display:block;font-weight:600;line-height:1.3}
/* Ticket térmico */
.rc{background:#fff;color:#111;font:13px/1.55 ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;padding:22px 20px;border-radius:6px;box-shadow:0 12px 30px -16px rgba(0,0,0,.4);max-width:340px;margin:0 auto;width:100%}
.rc .c{text-align:center}.rc .r{display:flex;justify-content:space-between;gap:10px}.rc hr{border:0;border-top:1px dashed #999;margin:10px 0}
.rc .T{font-weight:700;font-size:16px}
.qt{background:#fff;color:#111;padding:28px;font-size:14px;line-height:1.5}.qt table{color:#111}.qt th,.qt td{color:#111;border-bottom:1px solid #ddd;padding:8px}.qt h3{color:#111}.rc svg{width:100%;height:56px;display:block;margin-top:10px}
.tks{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.tks .prev{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(8,10,25,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
.ov.show{display:flex}
.dlg{background:var(--card);border-radius:20px;padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg.w{width:min(880px,100%)}
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.det .ph2{border-radius:16px}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}.specs dt{color:var(--mute)}.specs dd{margin:0;font-weight:600}
.codes{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:12px}
.codes img{width:92px;height:92px;background:#fff;border-radius:8px;flex:none;image-rendering:pixelated}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,160px);background:var(--ink);color:var(--card);padding:12px 20px;border-radius:12px;font-weight:600;transition:transform .25s;z-index:70;max-width:90vw}
.toast:not(.show){visibility:hidden}.toast.show{transform:translate(-50%,0)!important}
.bnav,.more{display:none}
/* Responsive */
@media(max-width:1200px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:minmax(0,1fr)}.pos,.tks{grid-template-columns:minmax(0,1fr) 340px}}
@media(max-width:900px){.board{grid-template-columns:minmax(0,1fr)}.sum{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside.side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:80;transform:translateX(-102%);transition:transform .25s;box-shadow:20px 0 60px -20px rgba(0,0,0,.5)}
 aside.side.open{transform:none}
 .burger{display:grid}.me span,.tb .hide-m{display:none}
 main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
 .pos,.tks{grid-template-columns:minmax(0,1fr)}
 .tks .prev{display:none}
 .ticket{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:65;border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .25s;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
 .ticket.open{transform:none}
 .mcart{display:flex;position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:39;background:var(--btn);color:#fff;border-radius:14px;padding:14px 18px;justify-content:space-between;font-weight:700;box-shadow:0 12px 30px -10px rgba(87,80,241,.7)}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:6px 2px;min-height:52px}
 .bnav button.on{color:var(--pri)}
 .det{grid-template-columns:minmax(0,1fr)}
 .donut{grid-template-columns:minmax(0,1fr);justify-items:center}.donut .bars{width:100%}
 .toast{bottom:auto;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-160px)}
}
#login[hidden]{display:none!important}
.scrim{position:fixed;inset:0;background:rgba(8,10,25,.45);z-index:75;display:none}.scrim.show{display:block}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack tr:last-child{border-bottom:0}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8.5em;color:var(--mute);font-size:13px}.stack td:empty{display:none}.stack .spk{margin-left:0}
 .kpis{gap:10px}.kpi .ic{width:40px;height:40px}.card{padding:16px}.f3{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.srch{max-width:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ======================= ESTADO ======================= */
const S={products:[],customers:[],collabs:[],sales:[],expenses:[],prints:[],moves:[],spools:[],
 cfg:{name:'Mi taller 3D',owner:'Yo',currency:'EUR',printers:['Impresora 1','Impresora 2'],fleet:[],footer:'¡Gracias por tu compra!',phone:'',logo:'',vat:0,vatIncl:true,kwh:0.18,labor:15,margin:60,fail:5,cats:[],email:''},

 tkq:'',tksel:'',mvf:'todos',gcat:'Todas',who:'clientes',lowOnly:false,jobs:[],quotes:[],jobf:'abiertos',qtab:'calc',garea:'todas',calc:null};

let _fmt=null;const money=n=>{try{if(!_fmt||_fmt._c!==S.cfg.currency){_fmt=new Intl.NumberFormat('es-ES',{style:'currency',currency:S.cfg.currency||'EUR'});_fmt._c=S.cfg.currency}return _fmt.format(+n||0)}catch(e){return (+n||0).toFixed(2)+' €'}};
const num=(n,d=0)=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:d}).format(+n||0);
const D=864e5,day0=t=>{const d=new Date(t);d.setHours(0,0,0,0);return +d};
const fdate=t=>new Date(t).toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
const fdt=t=>new Date(t).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const uid=()=>'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ico=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const COLS=['#5750f1','#12a150','#fb6b2b','#06b6d4','#e0a100','#d6336c','#8b5cf6','#64748b'];
const cats=()=>[...new Set(S.products.map(p=>p.cat||'Otros'))].sort();
const catColor=c=>COLS[Math.max(0,cats().indexOf(c||'Otros'))%COLS.length];
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)};
const status=(ok,txt)=>{$('#dot').className='dot'+(ok?' ok':'');$('#stt').textContent=txt};
const ESTADOS={idea:'Por diseñar',diseno:'Diseñando',listo:'En catálogo'};
const catalog=()=>S.products.filter(p=>(p.estado||'listo')==='listo');
const okSales=()=>S.sales.filter(s=>s.status!=='anulado'&&s.status!=='pendiente');
const owedSales=()=>S.sales.filter(s=>s.status==='pendiente');
const sDate=s=>s.paidAt||s.date;
const lowList=()=>catalog().filter(p=>(+p.stock||0)<=(+p.min||0));
const photo=p=>{if(p&&p.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(p.photo))return `<img src="${p.photo}" alt="" loading="lazy">`;
 const c=catColor(p&&p.cat);return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="${c}" opacity=".13"/><path d="M50 24 27 36.5v27L50 76l23-12.5v-27z" fill="${c}"/><path d="M50 49 27 36.5 50 24l23 12.5z" fill="#fff" opacity=".45"/><path d="M50 49v27l23-12.5v-27z" fill="#000" opacity=".16"/></svg>`};
const stockTag=p=>{const s=+p.stock||0;return s<=0?'<em class="tag r">Agotado</em>':s<=(+p.min||0)?`<em class="tag y">Quedan ${num(s)}</em>`:`<em class="tag g">${num(s)} en stock</em>`};
const qrURL=t=>{try{const q=qrcode(0,'M');q.addData(String(t));q.make();return q.createDataURL(6,2)}catch(e){return ''}};
const nextCode=()=>'P-'+String(Math.max(0,...S.products.map(p=>+(String(p.code||'').match(/^P-(\d+)$/)||[0,0])[1]))+1).padStart(4,'0');
const nextNum=()=>Math.max(0,...S.sales.map(s=>+s.num||0))+1;
const tnum=n=>'#'+String(n||0).padStart(4,'0');
const collabName=id=>id?((S.collabs.find(c=>c.id===id)||{}).name||'Colaborador'):(S.cfg.owner||'Yo');
const sel=(v,opts)=>opts.map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(v)?'selected':''}>${esc(l)}</option>`).join('');
const PAYS=[['Efectivo','cash'],['Tarjeta','card'],['Bizum','phone'],['Transferencia','bank']];
const PAYS_POS=[...PAYS,['A deber','clock']];

/* ======================= TEMA ======================= */
const isDark=()=>document.documentElement.classList.contains('dark');
function themeIcon(){$('#thi').setAttribute('href',isDark()?'#i-sun':'#i-moon')}

/* ======================= DATOS ======================= */
async function put(col,id,d){
 try{if(db){if(id)await db.doc(col+'/'+id).set(d);else{const r=await db.collection(col).add(d);return r.id}}
  else{if(id){const o=S[col].find(x=>x.id===id);if(o){Object.keys(o).forEach(k=>k!=='id'&&delete o[k]);Object.assign(o,d)}}else{const n={...d,id:uid()};S[col].unshift(n);render();return n.id}render()}}
 catch(e){toast(e&&e.code==='quota_exceeded'?'La base de datos está llena':'No se pudo guardar');throw e}
 return id;
}
async function patch(col,id,d){if(db)await db.doc(col+'/'+id).update(d);else{Object.assign(S[col].find(x=>x.id===id)||{},d);render()}}
async function del(col,id){try{if(db)await db.doc(col+'/'+id).delete();else{S[col]=S[col].filter(x=>x.id!==id);render()}}catch(e){toast('No se pudo borrar')}}
/* Kardex: todo cambio de stock deja un movimiento */
async function stockMove(p,delta,type,ref,extra={}){
 const before=+p.stock||0,after=Math.max(0,Math.round(before+delta));p.stock=after;
 const mv={date:Date.now(),pid:p.id,name:p.name,type,qty:after-before,before,after,ref:ref||'',...extra};
 if(db){await db.doc('products/'+p.id).update({stock:after});await db.collection('moves').add(mv)}else{S.moves.unshift({...mv,id:uid()})}
}
async function spoolMove(sp,grams){const left=Math.max(0,Math.round((+sp.left||0)+grams));sp.left=left;if(db)await db.doc('spools/'+sp.id).update({left});}
async function saveFile(filename,text,type){
 if(!IN_ARTIFACT){try{let body={filename,type,content:text};if(text instanceof Blob){const b64=await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]);fr.readAsDataURL(text)});body={filename,type,b64}}const r=await api('POST','api/export',body);const l=document.createElement('a');l.href=r.url;l.download=filename;document.body.appendChild(l);l.click();l.remove();return}catch(e){toast('No se pudo descargar');return}}
 if(!dls){try{dls=window.claude&&await claude.use('downloads')}catch(e){dls=null}}
 if(dls){try{await dls.save({filename,data:text instanceof Blob?text:new Blob([text],{type})});return}catch(e){if(e&&/cancel|declin|abort/i.test(String(e.code||e.message)))return}}
 try{await navigator.clipboard.writeText(text);toast('No se pudo descargar: copiado al portapapeles')}catch(e){toast('No se pudo descargar')}
}

/* ======================= ESCÁNER ======================= */
let actx=null;function beep(ok=true){if(!S.beep)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=ok?1250:330;o.type='square';g.gain.value=.05;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+(ok?.09:.25))}catch(e){}}
const findCode=c=>S.products.find(p=>String(p.code||'').toLowerCase()===c.toLowerCase()||p.id===c);
async function handleScan(raw,mode=S.scanMode){
 const code=fixScan(raw).replace(/^TALLER3D:/i,'');if(!code)return;
 if(S.view==='filamentos'||S.spools.some(s=>s.code&&s.code===code)){spoolFromQR(code);return}
 {const jb=S.jobs.find(j=>jnum(j.num)===code.toUpperCase());if(jb){beep();jobReceiptModal(jb.id);return}}
 const t=S.sales.find(s=>'T'+String(s.num).padStart(4,'0')===code.toUpperCase());if(t){beep();go('tickets');S.tksel=t.id;render();return}
 const p=findCode(code);
 if(!p){const o=parseSpoolQR(code);if(looksLikeSpool(o)){spoolFromQR(code);return}
  beep(false);S.last={err:true,code};render();
  modal(`<h2>Código nuevo</h2><p style="margin:0">No tengo nada con el código <b>${esc(code)}</b>. ¿Qué es?</p><div class="btns"><button class="btn" id="nwp">Una pieza nueva</button><button class="btn sf" id="nws">Una bobina de filamento</button><button class="btn gh" data-close>Nada, cancelar</button></div>`);
  $('#nwp').onclick=()=>editProduct('',{code});$('#nws').onclick=()=>spoolFromQR(code);return}
 beep();
 const n=S.askQty?await askNumber('¿Cuántas unidades de '+p.name+'?',1):1;if(!n)return;
 S.last={name:p.name,code:p.code,price:p.price,mode,n};
 if(mode==='vender'){if(S.view!=='vender')go('vender');addCart(p.id,n)}
 else if(mode==='entrada'){await stockMove(p,n,'ajuste','Entrada por escáner');toast('+'+n+' '+p.name+' → '+p.stock+' en stock');render()}
 else if(mode==='salida'){await stockMove(p,-n,'ajuste','Salida por escáner');toast('−'+n+' '+p.name+' → '+p.stock+' en stock');render()}
 else showProduct(p.id);
}
function decodeImage(file){return readQRImage(file,v=>handleScan(v))}
function decodeImageOld(file){
 if(!file)return;if(typeof jsQR!=='function'){toast('Lector de fotos no disponible');return}
 const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{const k=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);URL.revokeObjectURL(u);if(r&&r.data)handleScan(r.data);else{beep(false);toast('No se encontró ningún QR en la foto')}};
 img.src=u;
}
let kb='',kt=0;
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#gs').focus();return}
 if(e.key==='Escape'){closeModal();closeSide();$('#ticket')?.classList.remove('open');hideRes();return}

 {const c=S.cart.find(x=>x.id===id&&x.custom);if(c){c.qty+=d;if(c.qty<=0)S.cart=S.cart.filter(x=>x!==c);syncCart();return}}

async function igCanvas(p){
 const W=1080,c=document.createElement('canvas');c.width=W;c.height=W;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,W,W);g.addColorStop(0,'#1b1f3b');g.addColorStop(1,'#3a32c4');x.fillStyle=g;x.fillRect(0,0,W,W);

 const rr=(X,Y,w,hh,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+hh,r);x.arcTo(X+w,Y+hh,X,Y+hh,r);x.arcTo(X,Y+hh,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()};

 try{const im=await loadImg(src);x.save();rr(90,90,900,690,48);x.clip();const s=Math.max(900/im.width,690/im.height);x.drawImage(im,90+(900-im.width*s)/2,90+(690-im.height*s)/2,im.width*s,im.height*s);x.restore()}catch(e){}
 x.fillStyle='#ffc531';rr(760,690,250,110,55);x.fill();x.fillStyle='#1b1f3b';x.font='800 58px Inter,"Segoe UI",Roboto,sans-serif';x.textAlign='center';x.fillText(money(p.price),885,765);

 x.fillStyle='#c9ccff';x.font='600 34px Inter,"Segoe UI",Roboto,sans-serif';x.fillText([p.cat,p.material,p.color].filter(Boolean).join(' · ')+'  ·  Impresión 3D',90,935);

 x.textAlign='right';x.fillStyle='#ffc531';x.font='700 32px Inter,"Segoe UI",Roboto,sans-serif';x.fillText((+p.stock||0)>0?'Disponible · pídelo por mensaje':'Bajo pedido · escríbeme',990,1012);
 return c}

  o.brand=String(g('brand','vendor','manufacturer','marca')||'');o.material=String(g('material','type','tipo')||'');o.line=String(g('name','product','line','producto')||'');o.color=String(g('color_name','colorName','color','colour')||'');
  const hx=String(g('color_hex','colorHex','hex')||'');if(/^#?[0-9a-f]{6}$/i.test(hx))o.hex=hx[0]==='#'?hx:'#'+hx;

 const low=t.toLowerCase();

  const b=BR.find(([k])=>low.includes(k));if(b)o.brand=b[1]}
 else if(/^web\+spoolman:s-\d+/i.test(t)){o.notes='Bobina de Spoolman '+t.split(':').pop()}
 const M=['PETG-CF','PLA-CF','PA6-CF','PAHT-CF','PETG','PLA','ABS','ASA','TPU','PC','PVA','HIPS','PA','PVB'];const mm=M.find(m=>new RegExp('(^|[^a-z])'+m.toLowerCase().replace('-','[-_ ]?')+'([^a-z]|$)').test(low));if(mm)o.material=mm.replace(/-CF$/,'').replace('PA6','PA').replace('PAHT','PA');
 const SC=[['negro','black','Negro'],['blanco','white','Blanco'],['gris','grey','Gris'],['gray','gray','Gris'],['rojo','red','Rojo'],['naranja','orange','Naranja'],['amarillo','yellow','Amarillo'],['verde','green','Verde'],['azul','blue','Azul'],['morado','purple','Morado'],['rosa','pink','Rosa'],['marron','brown','Marrón'],['dorado','gold','Dorado'],['plata','silver','Plata']];

 const w=low.match(/(\d+(?:[.,]\d+)?)\s?(kg|g)(?![a-z])/);if(w){const n=parseFloat(w[1].replace(',','.'));o.size=w[2]==='kg'?n*1000:n}

/* ======================= LECTURA DE STL / 3MF ======================= */
async function unzip(buf){
 const dv=new DataView(buf),u8=new Uint8Array(buf);let e=-1;for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
 if(e<0)throw new Error('No es un archivo 3MF válido');
 let p=dv.getUint32(e+16,true);const n=dv.getUint16(e+10,true),files={},td=new TextDecoder();
 for(let k=0;k<n;k++){if(dv.getUint32(p,true)!==0x02014b50)break;const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true),name=td.decode(u8.subarray(p+46,p+46+nl));
  files[name]={meth,cs,lo};p+=46+nl+xl+cl}
 const get=async name=>{const f=files[name];if(!f)return null;const ln=dv.getUint16(f.lo+26,true),lx=dv.getUint16(f.lo+28,true),st=f.lo+30+ln+lx,raw=u8.subarray(st,st+f.cs);
  if(f.meth===0)return raw.slice().buffer;if(f.meth!==8)throw new Error('Compresión no soportada');
  if(typeof DecompressionStream!=='function')throw new Error('Tu navegador no puede abrir 3MF; actualízalo');
  return await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()};
 return {names:Object.keys(files),get};
}
function meshStats(V,T){let vol=0,area=0;const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
 for(let i=0;i<V.length;i+=3)for(let a=0;a<3;a++){const v=V[i+a];if(v<mn[a])mn[a]=v;if(v>mx[a])mx[a]=v}
 for(let i=0;i<T.length;i+=3){const a=T[i]*3,b=T[i+1]*3,c=T[i+2]*3;const ax=V[a],ay=V[a+1],az=V[a+2],bx=V[b],by=V[b+1],bz=V[b+2],cx=V[c],cy=V[c+1],cz=V[c+2];
  vol+=(ax*(by*cz-bz*cy)-ay*(bx*cz-bz*cx)+az*(bx*cy-by*cx))/6;const ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;area+=Math.hypot(uy*vz-uz*vy,uz*vx-ux*vz,ux*vy-uy*vx)/2}
 return {vol:Math.abs(vol),area,box:mx.map((v,i)=>Math.max(0,v-mn[i])),tris:T.length/3}}
function parseSTL(buf){const dv=new DataView(buf);
 if(buf.byteLength>=84){const n=dv.getUint32(80,true);if(84+n*50===buf.byteLength){const V=new Float32Array(n*9),T=new Uint32Array(n*3);for(let i=0;i<n;i++){const o=84+i*50+12;for(let k=0;k<9;k++)V[i*9+k]=dv.getFloat32(o+k*4,true);T[i*3]=i*3;T[i*3+1]=i*3+1;T[i*3+2]=i*3+2}return meshStats(V,T)}}
 const txt=new TextDecoder().decode(buf),re=/vertex\s+([-+\d.eE]+)\s+([-+\d.eE]+)\s+([-+\d.eE]+)/g,V=[];let m;while(m=re.exec(txt))V.push(+m[1],+m[2],+m[3]);
 if(V.length<9)throw new Error('No he encontrado triángulos en el STL');const T=new Uint32Array(V.length/3).map((_,i)=>i);return meshStats(new Float32Array(V),T)}
function parseModelXML(txt){const doc=new DOMParser().parseFromString(txt,'application/xml');const unit=(doc.documentElement.getAttribute('unit')||'millimeter').toLowerCase(),k={micron:.001,millimeter:1,centimeter:10,inch:25.4,foot:304.8,meter:1000}[unit]||1;
 let tot={vol:0,area:0,box:[0,0,0],tris:0};
 doc.querySelectorAll('mesh').forEach(me=>{const V=[],T=[];me.querySelectorAll('vertex').forEach(v=>V.push(+v.getAttribute('x')*k,+v.getAttribute('y')*k,+v.getAttribute('z')*k));me.querySelectorAll('triangle').forEach(t=>T.push(+t.getAttribute('v1'),+t.getAttribute('v2'),+t.getAttribute('v3')));
  if(T.length){const s=meshStats(V,T);tot.vol+=s.vol;tot.area+=s.area;tot.tris+=s.tris;tot.box=tot.box.map((b,i)=>Math.max(b,s.box[i]))}});return tot}
async function analyzeModel(file){
 const buf=await file.arrayBuffer(),name=file.name,ext=name.toLowerCase().split('.').pop(),r={name,ext};
 if(ext==='stl'){Object.assign(r,parseSTL(buf));return r}
 if(ext!=='3mf')throw new Error('Sube un archivo .stl o .3mf');
 const z=await unzip(buf),td=new TextDecoder();
 const si=z.names.find(n=>/slice_info\.config$/i.test(n));
 if(si){const doc=new DOMParser().parseFromString(td.decode(await z.get(si)),'application/xml');const plates=[...doc.querySelectorAll('plate')].map(p=>{const md=k=>{const e=[...p.querySelectorAll('metadata')].find(x=>x.getAttribute('key')===k);return e?e.getAttribute('value'):''};
   return {index:md('index'),secs:+md('prediction')||0,grams:+md('weight')||0,fil:[...p.querySelectorAll('filament')].map(f=>({type:f.getAttribute('type')||'',color:f.getAttribute('color')||'',g:+f.getAttribute('used_g')||0}))}}).filter(p=>p.secs||p.grams);
  if(plates.length){r.sliced=true;r.plates=plates;r.grams=plates.reduce((t,p)=>t+p.grams,0);r.hours=plates.reduce((t,p)=>t+p.secs,0)/3600;r.fil=plates.flatMap(p=>p.fil)}}
 const th=z.names.find(n=>/Metadata\/plate_1\.png$/i.test(n))||z.names.find(n=>/thumbnail.*\.png$/i.test(n));
 if(th){try{r.thumb=URL.createObjectURL(new Blob([await z.get(th)],{type:'image/png'}))}catch(e){}}
 let tot=null;for(const n of z.names.filter(n=>/\.model$/i.test(n))){const s=parseModelXML(td.decode(await z.get(n)));if(s.tris){tot=tot||{vol:0,area:0,box:[0,0,0],tris:0};tot.vol+=s.vol;tot.area+=s.area;tot.tris+=s.tris;tot.box=tot.box.map((b,i)=>Math.max(b,s.box[i]))}}
 if(tot)Object.assign(r,tot);
 if(!r.sliced&&!tot)throw new Error('El 3MF no tiene ninguna pieza ni datos de laminado');
 return r}
function estimate(m,pr,dens,supp){ // gramos y horas aproximados a partir del volumen y el perfil de la impresora

/* Muchos lectores vienen configurados como teclado inglés (US). Con el teclado del ordenador en español,
   "https://" llega como "httpsÑ--". Si se detecta, se traduce de vuelta. */
const US_ON_ES={'Ñ':':','ñ':';',"'":'-','-':'/','_':'?','¡':'=','¿':'+','"':'@','&':'^','/':'&','(':'*',')':'(','=':')','`':'[','+':']','^':'{','*':'}','ç':'\\','Ç':'|','´':"'",'¨':'"','º':'`','ª':'~',';':'<',':':'>'};
function fixScan(s){s=String(s||'').replace(/[\r\n\t]+$/,'').trim();
 if(/^https?Ñ[-'][-']/i.test(s)||/^wwwÑ/i.test(s)||(/Ñ--/.test(s)&&!/:\/\//.test(s)))return [...s].map(ch=>US_ON_ES[ch]??ch).join('');
 return s}

/* ======================= MODO SERVIDOR (versión instalable) ======================= */
/* En la app instalada (Docker / Raspberry Pi / Android) los datos viven en la base de datos SQLite del propio
   servidor. Este adaptador ofrece la misma interfaz que usa el resto de la app. */
let ME=null,SRV={};
async function api(method,url,body){
 const r=await fetch(url,{method,credentials:'same-origin',headers:body!==undefined?{'content-type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined});
 if(r.status===401){ME=null;showLogin();throw {code:'revoked',message:'Sesión caducada'}}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){const m=(j&&j.error)||t||('Error '+r.status);if(r.status===403)toast(m);throw {code:r.status===403?'invalid_argument':'unavailable',message:m}}
 return j}
function serverDB(){
 const cache={},subs=[];let es=null,ready=false;
 const docs=col=>Object.entries(cache[col]||{}).map(([id,d])=>({id,exists:true,data:()=>d,metadata:{fromCache:false}}));
 const fire=col=>subs.filter(s=>s.col===col).forEach(s=>s.fn());
 const apply=(col,id,data)=>{cache[col]=cache[col]||{};if(data==null)delete cache[col][id];else cache[col][id]=data;fire(col)};
 const split=p=>{const i=p.indexOf('/');return [p.slice(0,i),p.slice(i+1)]};
 const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
 async function load(){const all=await api('GET','api/data');Object.keys(cache).forEach(k=>delete cache[k]);Object.entries(all||{}).forEach(([c,m])=>cache[c]=m);ready=true;[...new Set(subs.map(s=>s.col))].forEach(fire)}
 function stream(){try{es&&es.close()}catch(e){}es=new EventSource('api/stream');es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.reload)load();else apply(m.col,m.id,m.data)}catch(_){}};es.onerror=()=>{status(false,'Reconectando…')};es.onopen=()=>{status(true,'Guardado en tu servidor');load().catch(()=>{})}}
 const docRef=path=>{const [col,id]=split(path);return {id,path,
  get:async()=>{const d=(cache[col]||{})[id];return {id,exists:!!d,data:()=>d,metadata:{fromCache:false}}},
  set:async d=>{const prev=(cache[col]||{})[id];apply(col,id,d);try{await api('PUT','api/doc/'+encodeURIComponent(col)+'/'+encodeURIComponent(id),d)}catch(e){apply(col,id,prev);throw e}},
  update:async d=>{const prev=(cache[col]||{})[id];if(!prev)throw {code:'invalid_argument',message:'No existe'};apply(col,id,{...prev,...d});try{await api('PATCH','api/doc/'+encodeURIComponent(col)+'/'+encodeURIComponent(id),d)}catch(e){apply(col,id,prev);throw e}},
  delete:async()=>{const prev=(cache[col]||{})[id];apply(col,id,null);try{await api('DELETE','api/doc/'+encodeURIComponent(col)+'/'+encodeURIComponent(id))}catch(e){apply(col,id,prev);throw e}},
  onSnapshot:(fn)=>{const s={col,fn:()=>{const d=(cache[col]||{})[id];fn({id,exists:!!d,data:()=>d,metadata:{fromCache:false}})}};subs.push(s);if(ready)setTimeout(s.fn);return ()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}}};
 const colRef=col=>{const q={path:col,doc:id=>docRef(col+'/'+(id||rid())),add:async d=>{const r=docRef(col+'/'+rid());await r.set(d);return r},orderBy:()=>q,limit:()=>q,where:()=>q,get:async()=>({docs:docs(col),size:docs(col).length,empty:!docs(col).length,metadata:{fromCache:false}}),
  onSnapshot:(fn)=>{const s={col,fn:()=>{const d=docs(col);fn({docs:d,size:d.length,empty:!d.length,metadata:{fromCache:false},docChanges:()=>[]})}};subs.push(s);if(ready)setTimeout(s.fn);return ()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}};return q};
 return {doc:docRef,collection:colRef,_load:load,_stream:stream};

 S.quotes.forEach(x=>[qnum(x.num),x.title,x.customerName].some(v=>String(v||'').toLowerCase().includes(q))&&r.push({t:'Presupuesto',l:qnum(x.num)+' '+(x.title||''),a:()=>viewQuote(x.id)}));

const closeSide=()=>{$('#side').classList.remove('open');$('#scrim').classList.remove('show')};

/* ======================= RENDER ======================= */
const V={panel:vPanel,vender:vVender,tickets:vTickets,piezas:vPiezas,disenos:vDisenos,filamentos:vFilamentos,movimientos:vMovimientos,clientes:vClientes,colaboradores:vColaboradores,gastos:vGastos,ajustes:vAjustes,servicios:vServicios,presupuestos:vPresupuestos};
let rq=0;const render=()=>{if(rq)return;rq=requestAnimationFrame(()=>{rq=0;doRender()})};
function doRender(){
 const a=document.activeElement,fid=a&&a.id,pos=a&&a.selectionStart,keep=['q','tkq','scan','cash'].includes(fid)?fid:'';if(S.view==='presupuestos'&&a&&a.closest&&a.closest('#calcf'))return;
 const scanVal=$('#scan')?.value||'';
 $('#main').innerHTML=V[S.view]();
 document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
 const low=lowList().length,lc=$('#lowc');lc.hidden=!low;lc.textContent=low;$('#pip').hidden=!low;
 $('#bname').innerHTML=esc(S.cfg.name);const who=!IN_ARTIFACT&&ME?(ME.name||ME.username):(S.cfg.owner||'Yo');$('#mename').textContent=who;$('#avt').textContent=(who||'Y')[0].toUpperCase();
 $('#lmark').innerHTML=logoMark(32);const oj=S.jobs.filter(j=>j.status==='pendiente'||j.status==='curso').length,jc=$('#jobc');jc.hidden=!oj;jc.textContent=oj;$('#sver').textContent=versionText().replace(' · ','\n');
 if(S.view==='ajustes')setTimeout(paintUsers,0);
 syncCart();themeIcon();paintBarcodes($('#main'));
 if($('#scan')&&scanVal)$('#scan').value=scanVal;
 if(keep){const el=$('#'+keep);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
 if(ro){ro.disconnect();ro=null}const c=$('#chart');if(c){ro=new ResizeObserver(drawChart);ro.observe(c)}
}
function go(v){if(!V[v])return;S.view=v;S.q='';closeModal();closeSide();try{history.replaceState(null,'','#'+v)}catch(e){}render();scrollTo(0,0)}
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(V[v]&&v!==S.view)go(v)});

/* ======================= EVENTOS ======================= */
$('#theme').onclick=toggleTheme;
function accountModal(){
 if(IN_ARTIFACT){modal(`<div style="display:flex;gap:12px;align-items:center"><span class="av">${esc((S.cfg.owner||'Y')[0].toUpperCase())}</span><div><h2>${esc(S.cfg.owner||'Mi usuario')}</h2><div class="note">${esc(S.cfg.email||'Sin email')}</div></div></div>
  <form id="fme2" style="display:grid;gap:12px"><div class="f2"><label>Tu nombre<input name="owner" value="${esc(S.cfg.owner)}"></label><label>Tu email<input name="email" type="email" value="${esc(S.cfg.email)}"></label></div>
  <p class="note" style="margin:0">En esta versión personal entras con tu cuenta de Claude. En la versión instalada (tu servidor o la APK) entras con tu usuario (nick) y contraseña.</p>
  <div class="acts"><button type="button" class="btn gh" data-close>Cerrar</button><button class="btn">Guardar</button></div></form>`);
  $('#fme2').onsubmit=async e=>{e.preventDefault();const f=e.target;await saveCfg({owner:f.owner.value.trim()||'Yo',email:f.email.value.trim()});closeModal();toast('Guardado')};return}
 if(!ME){showLogin();return}
 modal(`<div style="display:flex;gap:12px;align-items:center"><span class="av">${esc((ME.name||ME.username||'?')[0].toUpperCase())}</span><div><h2>${esc(ME.name||ME.username)}</h2><div class="note">@${esc(ME.username)} · ${esc({admin:'Administrador',editor:'Puede editar',lector:'Solo ver'}[ME.role]||ME.role)}</div></div></div>
  <form id="fme3" style="display:grid;gap:12px"><div class="f2"><label>Nombre<input name="name" value="${esc(ME.name||'')}"></label><label>Email${SRV.requireEmail?'':' (opcional)'}<input name="email" type="email" value="${esc(ME.email||'')}" ${SRV.requireEmail?'required':''}></label></div>
  <div class="acts" style="justify-content:space-between"><div class="btns"><button type="button" class="btn gh" id="chpw">Cambiar contraseña</button>${ME.role==='admin'?'<button type="button" class="btn gh" data-go="ajustes">Usuarios y ajustes</button>':''}<button type="button" class="btn rd" id="logout">${ico('out')}Salir</button></div><button class="btn">Guardar</button></div></form>`);
 $('#fme3').onsubmit=async e=>{e.preventDefault();const f=e.target;try{const r=await api('PATCH','api/me',{name:f.name.value.trim(),email:f.email.value.trim()});ME=r.user;closeModal();toast('Cuenta guardada');render()}catch(err){toast(err.message||'No se pudo guardar')}}}
$('#meBtn').onclick=accountModal;$('#qscan').onclick=quickScan;
$('#burger').onclick=()=>{$('#side').classList.add('open');$('#scrim').classList.add('show')};$('#scrim').onclick=closeSide;
$('#bell').onclick=()=>{S.lowOnly=true;go('piezas')};
$('#mcart').onclick=()=>{if(S.cart.length)$('#ticket')?.classList.toggle('open')};
document.addEventListener('input',e=>{const t=e.target;
 if(t.closest&&t.closest('#calcf')){calcRead();paintCalc();return}
 if(t.id==='q'){S.q=t.value;render()}else if(t.id==='tkq'){S.tkq=t.value;render()}
 else if(t.id==='cash'){S.cash=t.value;const tot=S.cart.reduce((s,l)=>s+l.qty*l.price,0),c=+t.value||0,el=$('#chg');if(el){el.textContent=c?money(c-tot):'—';el.className=c&&c<tot?'dn':'up'}}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='cust')S.cust=t.value;else if(t.id==='seller')S.seller=t.value;
 else if(t.id==='smode'){S.scanMode=t.value;$('#scan')?.focus()}else if(t.id==='obeep')S.beep=t.checked;else if(t.id==='oqty')S.askQty=t.checked;
 else if(t.id==='qrimg'){closeModal();decodeImage(t.files[0]);t.value=''}
 else if(t.closest&&t.closest('#calcf')){if(t.name==='spool'){const sp=S.spools.find(s=>s.id===t.value);if(sp){const f=$('#calcf');if(sp.priceKg)f.priceKg.value=sp.priceKg;if(DENS[sp.material])f.material.value=sp.material}}calcRead();if(t.name==='printer'||t.name==='material'||t.name==='supp'){if(lastModel&&!lastModel.sliced&&lastModel.vol){const pr=fleet().find(x=>x.id===S.calc.printer)||PDEF,es=estimate(lastModel,pr,DENS[S.calc.material],S.calc.supp);S.calc.grams=+es.grams.toFixed(1);S.calc.hours=+es.hours.toFixed(2);const f=$('#calcf');f.grams.value=S.calc.grams;f.hours.value=S.calc.hours}}paintCalc()}
 else if(t.id==='restoref'){const fl=t.files[0];t.value='';if(fl)fl.text().then(txt=>{let j;try{j=JSON.parse(txt)}catch(_){toast('Archivo no válido');return}confirmBox('Se sustituirán TODOS los datos actuales por los de la copia del '+(j.date||'').slice(0,10)+'.',async()=>{await api('POST','api/restore',j);toast('Copia restaurada')})})}
 else if(t.id==='mfile'){loadModel(t.files[0]);t.value=''}
 else if(t.id==='logof'){const fl=t.files[0];if(fl)shrinkLogo(fl).then(d=>saveCfg({logo:d})).then(()=>toast('Logo guardado')).catch(()=>toast('No se pudo leer la imagen'))}});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('#drop')){e.preventDefault();e.target.closest('#drop').style.borderColor='var(--pri)'}});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#drop');if(!z)return;e.preventDefault();z.style.borderColor='';const f=e.dataTransfer.files[0];if(f)loadModel(f)});
document.addEventListener('submit',async e=>{const f=e.target,id=f.id;if(!['fcfg','fcost','fcats','fme'].includes(id))return;e.preventDefault();
 try{if(id==='fcfg')await saveCfg({name:f.name.value.trim()||'Mi taller',legal:f.legal.value.trim(),nif:f.nif.value.trim(),phone:f.phone.value.trim(),addr:f.addr.value.trim(),city:f.city.value.trim(),cemail:f.cemail.value.trim(),web:f.web.value.trim(),currency:f.currency.value,vat:+f.vat.value||0,vatIncl:f.vatIncl.value==='1',iban:f.iban.value.trim(),footer:f.footer.value.trim(),terms:f.terms.value.trim()});
  else if(id==='fcost')await saveCfg({kwh:+f.kwh.value||0,labor:+f.labor.value||0,margin:+f.margin.value||0,fail:+f.fail.value||0});
  else if(id==='fcats')await saveCfg({cats:f.cats.value.split('\n').map(s=>s.trim()).filter(Boolean)});
  else if(id==='fme')await saveCfg({owner:f.owner.value.trim()||'Yo',email:f.email.value.trim()});
  toast('Guardado')}catch(_){}});
document.addEventListener('click',async e=>{
 if(e.target.id==='ov'){closeModal();return}
 const t=e.target.closest('button,tr,.sm[data-low]');if(!t)return;const d=t.dataset;
 if('close' in d){closeModal();return}
 if(d.v){go(d.v);return}if(d.go){if(d.tkf)S.tkf=d.tkf;go(d.go);return}
 if(d.add||d.inc)addCart(d.add||d.inc,1);else if(d.dec)addCart(d.dec,-1);
 else if(d.cat){S.cat=d.cat;render()}else if(d.pay){S.pay=d.pay;syncCart()}else if(d.lay){S.layout=d.lay;render()}
 else if(d.range!=null){S.range=+d.range;render()}else if(d.who){S.who=d.who;render()}else if(d.mvf){S.mvf=d.mvf;render()}else if(d.gcat){S.gcat=d.gcat;render()}
 else if('low' in d){S.lowOnly=!S.lowOnly;render()}
 else if(d.show)showProduct(d.show);else if(d.edit)editProduct(d.edit);else if(d.print)registerPrint(d.print);else if(d.adj)adjustStock(d.adj);
 else if(d.sell){const p=S.products.find(x=>x.id===d.sell);closeModal();if(p&&(S.cart.find(l=>l.id===p.id)||{qty:0}).qty<(+p.stock||0)){go('vender');addCart(p.id,1)}else toast('No queda más stock')}
 else if(d.dz)designCard(d.dz);else if(d.sp)editSpool(d.sp);
 else if(d.tk){S.tksel=d.tk;if(matchMedia('(max-width:860px)').matches){const s=S.sales.find(x=>x.id===d.tk);if(s)receiptModal(s)}else render()}
 else if(d.tkm){const s=S.sales.find(x=>x.id===d.tkm);if(s)receiptModal(s)}
 else if(d.dlt){const s=S.sales.find(x=>x.id===d.dlt);if(s)saveFile('ticket-'+String(s.num).padStart(4,'0')+'.html',receiptFile(s),'text/html')}
 else if(d.cpt){const s=S.sales.find(x=>x.id===d.cpt);if(s)navigator.clipboard.writeText(receiptText(s)).then(()=>toast('Ticket copiado'),()=>toast('No se pudo copiar'))}
 else if(d.anul)anular(d.anul);
 else if(d.ec)editCustomer(d.ec);else if(d.eb)editCollab(d.eb);else if(d.eg)editExpense(d.eg);
 else if(d.th){if(d.th!==(isDark()?'dark':'light'))toggleTheme()}
 else if(d.payt)payTicket(d.payt);else if(d.tkf){S.tkf=d.tkf;render()}else if(d.ig)igPost(d.ig);
 else if(d.pr)editPrinter(d.pr);else if(d.ej){closeModal();editJob(d.ej)}else if(d.jr)jobReceiptModal(d.jr);else if(d.jobf){S.jobf=d.jobf;render()}
 else if(d.qtab){S.qtab=d.qtab;render()}else if(d.vq)viewQuote(d.vq);else if(d.garea){S.garea=d.garea;render()}
 else if(d.eu){api('GET','api/users').then(l=>{const u=l.find(x=>x.id===d.eu);if(u)editUser(u)}).catch(()=>{})}
 else if(CSV[t.id]){const [n,c]=CSV[t.id]();saveFile(n,c,'text/csv')}
 else switch(t.id){
  case 'clr':S.cart=[];S.cash='';syncCart();break;case 'cobrar':cobrar();break;
  case 'newp':editProduct('');break;case 'newd':editProduct('',{estado:'idea',stock:0,code:''});break;case 'labels':labelsSheet();break;
  case 'newsp':editSpool('');break;case 'newc':editCustomer('');break;case 'newb':editCollab('');break;case 'newg':editExpense('');break;
  case 'bmore':moreSheet();break;
  case 'quickp':quickPiece();break;case 'quickc':case 'quickc2':quickClient();break;case 'camscan':cameraScan(v=>handleScan(v));break;
  case 'newj':editJob('');break;case 'newq':editQuote('');break;case 'scansp':scanSpool();break;case 'addpr':pickPrinter();break;case 'nologo':saveCfg({logo:''});break;
  case 'c2q':{const c=calcRead(),r=calcCompute(c);editQuote('',{title:c.name||'',lines:[{d:(c.name||'Pieza impresa en 3D'),q:c.qty,u:+r.price.toFixed(2)}]});break}
  case 'c2p':calcRead();applyToPiece();break;case 'c2s':{const c=calcRead();saveCfg({kwh:c.kwh,labor:c.laborRate,margin:c.margin,fail:c.fail}).then(()=>toast('Valores guardados por defecto'));break}
  case 'newu':editUser(null);break;case 'logout':api('POST','api/logout').catch(()=>{}).then(()=>location.reload());break;
  case 'chpw':modal(`<h2>Cambiar contraseña</h2><form id="fpw" style="display:grid;gap:12px"><label>Contraseña actual<input name="old" type="password" required autocomplete="current-password"></label><label>Nueva contraseña<input name="pw" type="password" minlength="8" required autocomplete="new-password"></label><div class="acts"><button type="button" class="btn gh" data-close>Cancelar</button><button class="btn">Cambiar</button></div></form>`);$('#fpw').onsubmit=async ev=>{ev.preventDefault();const f=ev.target;try{await api('POST','api/password',{old:f.old.value,password:f.pw.value});closeModal();toast('Contraseña cambiada')}catch(err){toast(err.message||'No se pudo cambiar')}};break;case 'mth':closeModal();toggleTheme();break;
  case 'delej':confirmBox('Se borrarán solo los registros de ejemplo. Lo que hayas creado tú se queda.',async()=>{for(const k of ['sales','moves','prints','expenses','jobs','quotes','products','customers','collabs','spools'])for(const x of S[k].filter(x=>/^ej/.test(x.id)))await del(k,x.id);toast('Datos de ejemplo borrados')});break;
 }
});
const h=location.hash.slice(1);if(V[h])S.view=h;
doRender();

/* ======================= BASE DE DATOS ======================= */
function subscribeAll(){
 const timer=setTimeout(()=>{if(!live)status(false,'Sin conexión todavía…')},10000);
 const ok=snap=>{if(!snap.metadata.fromCache&&!live){live=true;clearTimeout(timer);status(true,IN_ARTIFACT?'Todo guardado en la nube':'Guardado en tu servidor')}else if(!snap.metadata.fromCache)clearTimeout(timer)};
 const fail=()=>{clearTimeout(timer);status(false,'Error de conexión')};
 const sub=(col,q)=>q.onSnapshot(snap=>{S[col]=snap.docs.map(d=>({id:d.id,...d.data()}));ok(snap);if(col==='products')S.cart=S.cart.filter(l=>l.custom||S.products.some(p=>p.id===l.id));render()},fail);
 ['products','customers','collabs','spools','quotes'].forEach(c=>sub(c,db.collection(c)));
 ['sales','expenses','prints','moves','jobs'].forEach(c=>sub(c,db.collection(c).orderBy('date','desc').limit(1000)));
 db.doc('config/main').onSnapshot(s=>{if(s.exists){const d=s.data()||{};S.cfg={...S.cfg,...d,printers:Array.isArray(d.printers)&&d.printers.length?d.printers.map(String):S.cfg.printers};_fmt=null;render()}},()=>{});
}
(async()=>{
 if(!IN_ARTIFACT){initServer();return}
 try{db=await claude.use('db')}catch(e){db=null}
 if(!db){status(false,'Sin base de datos: los cambios no se guardan');return}
 subscribeAll();
})();
}
</script>
