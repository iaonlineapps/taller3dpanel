<style>
/* VOICE: panel de gestión personal, limpio y tranquilo, cifras grandes y claras
   IDEA: el cuaderno de cuentas del taller convertido en panel de control
   PICTURE: la gráfica de ingresos contra gastos y la galería de piezas con su stock
   COLOUR and TYPE: índigo de marca, verde ingresos, coral gastos; Inter + JetBrains Mono para tickets
   LAYOUT: menú lateral agrupado + barra superior; en móvil, barra inferior con "Más" */
:root{color-scheme:light;--bg:#f3f4f8;--card:#fff;--ink:#111427;--mute:#646b80;--line:#e6e8ef;--soft:#f1f2f8;--side:#fff;--pri:#5750f1;--pri2:#eeedfe;--btn:#5750f1;--inc:#12a150;--exp:#ef4b4b;--warn:#c2700a;--cy:#06b6d4;--or:#fb6b2b}
:root.dark{color-scheme:dark;--bg:#0b0e1a;--card:#141a2e;--ink:#eceef7;--mute:#99a1b8;--line:#242b44;--soft:#1b2238;--side:#10152a;--pri:#7b75ff;--pri2:#232250;--inc:#34d399;--exp:#ff7b7b;--warn:#fbbf24}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(24px,2.6vw,30px)}h2{font-size:17px}h3{font-size:15px}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* Estructura */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
aside.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:20px 14px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:2px 10px 18px}
.logo b{color:var(--pri)}
.grp{font-size:12px;color:var(--mute);font-weight:600;padding:16px 12px 6px}
.side button.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mute);font-weight:500;min-height:44px;text-align:left;width:100%}
.side button.nv:hover{background:var(--soft);color:var(--ink)}
.side button.nv.on{background:var(--pri2);color:var(--pri);font-weight:600}
.side .cnt{margin-left:auto;font-size:12px;background:var(--exp);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}
.dbcard{margin-top:auto;background:var(--soft);border-radius:14px;padding:14px;font-size:13px;color:var(--mute);display:flex;gap:10px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none}.dot.ok{background:var(--inc)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px clamp(14px,2.4vw,28px);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.srch{position:relative;flex:1;max-width:460px}
.srch input{padding-left:40px;background:var(--soft);border-color:transparent}
.srch>svg{position:absolute;left:12px;top:13px;color:var(--mute)}
.sortl{display:flex;gap:8px;align-items:center;font-weight:500;white-space:nowrap;margin:0}.sortl select{width:auto;min-height:40px;padding-top:6px;padding-bottom:6px}
.xw{position:relative;display:block;min-width:0}.xw>input{width:100%;padding-right:40px}
.xw>.xb{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;min-height:0;padding:0;border:0;border-radius:999px;background:var(--line);color:var(--ink);font-size:18px;line-height:30px;text-align:center;cursor:pointer;display:block}.xw>.xb:hover{background:var(--mute);color:var(--card)}
.xw>input:placeholder-shown+.xb{display:none}.xw>input:placeholder-shown{padding-right:13px}.srch>.xw{position:static}
.res{position:absolute;top:52px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px -20px rgba(10,15,40,.35);padding:6px;display:none;max-height:60vh;overflow:auto}
.res.show{display:block}
.res button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:10px;text-align:left}
.res button:hover,.res button.act{background:var(--soft)}
.res small{color:var(--mute);margin-left:auto;font-size:12px}
.tb{display:flex;gap:8px;margin-left:auto;align-items:center}
.vchip{height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--mut);font-size:12px;font-weight:600;white-space:nowrap}.vchip:hover{color:var(--pri)}
@media(max-width:560px){.vchip{display:none}}
.kiosk .side,.kiosk header.top,.kiosk #bnav,.kiosk .pfoot{display:none!important}.kiosk .app{grid-template-columns:minmax(0,1fr)!important}.kiosk #main{padding:14px!important;max-width:none!important}
.kz{display:grid;gap:14px}.kz-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.kz-brand{display:flex;align-items:center;gap:10px}.kz-brand img{width:42px;height:42px;border-radius:10px;object-fit:cover}.kz-brand b{display:block;font-size:18px}.kz-brand span{font-size:12px;color:var(--mut)}
.kz-stats{display:flex;gap:14px;flex-wrap:wrap;font-weight:600;font-size:15px;flex:1}.kz-stats span{display:flex;align-items:center;gap:6px}.kz-stats i{width:12px;height:12px;border-radius:50%;display:inline-block}
.kz-clock{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}.kz-actions{display:flex;gap:8px}
.kz-btn{white-space:nowrap;min-height:52px;padding:0 18px;border-radius:14px;border:0;background:var(--pri);color:#fff;font-weight:700;font-size:17px;cursor:pointer;touch-action:manipulation}.kz-btn.gh{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.kz-btn.ok{background:#12a150}.kz-btn.bad{background:#ef4b4b}.kz-btn.ksm{min-height:44px;font-size:15px;padding:0 14px}.kz-btn.big{min-height:64px;font-size:19px;text-align:left}.kz-btn:active{transform:scale(.97)}
.kz-main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}@media(max-width:1000px){.kz-main{grid-template-columns:minmax(0,1fr)}}
.kz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.kz-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.kz-pr{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;border-left:8px solid var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,var(--card)),var(--card) 60%)}
.kz-ph{width:72px;height:72px;border-radius:16px;overflow:hidden;background:var(--soft);cursor:pointer}.kz-body{display:grid;gap:6px;min-width:0}
.kz-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.kz-head b{font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.kz-badge{background:var(--c);color:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.kz-job{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kz-mut{color:var(--mut);font-size:14px}
.kz-pct{font-size:40px;font-weight:800;line-height:1;color:var(--c)}.kz-bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}.kz-bar i{display:block;height:100%;background:var(--c,var(--pri));border-radius:99px}.kz-bar.ksm{height:6px;margin-top:4px;--c:#12a150}
.kz-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:4px}.kz-row .kz-btn{padding:0 10px}
@media(max-width:560px){.kz-pr{grid-template-columns:64px minmax(0,1fr)}.kz-ph{width:64px;height:64px}.kz-clock{font-size:22px;margin-left:auto}.kz-pct{font-size:32px}.kz-row .kz-btn{font-size:15px;padding:0 8px}.kz-stats{order:3;flex-basis:100%;font-size:13px;gap:10px}.kz-actions{margin-left:auto}.kz-top{gap:10px}}
.kz-q{display:grid;gap:10px}.kz-qi{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.kz-qth{width:52px;height:52px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:24px;overflow:hidden}.kz-qth img{width:100%;height:100%;object-fit:cover}
.kz-qtx b{display:block;font-size:16px}.kz-qtx span{font-size:13px;color:var(--mut)}.kz-qb{display:flex;gap:6px}.kz-urg{background:#ef4b4b;color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;vertical-align:middle}
.backb{margin:0 0 12px;min-height:38px;padding:0 14px;font-size:14px;width:auto!important;display:inline-flex!important;justify-self:start;align-self:start}
.pfoot{margin:28px 0 8px;text-align:center;font-size:12.5px;color:var(--mut);line-height:1.8}.pfoot a,.pfoot button{color:var(--pri);font-weight:600;background:none;border:0;padding:0;font-size:inherit;min-height:0;cursor:pointer}
.pfoot .madeby{display:block;font-size:11.5px;line-height:1.6;opacity:.85}.pfoot .madeby a{font-weight:500}
.btn.newsup{position:sticky;bottom:0;align-self:flex-end;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25);margin-top:-6px}.btn.newsup.on{display:inline-flex}.news h3{font-size:15px;margin:14px 0 6px}.news ul{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:var(--card);color:var(--ink);position:relative}
.tb [data-tip],.top .burger{position:relative}
@media(hover:hover){.tb [data-tip]:hover::after,.top .burger[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;z-index:80;background:var(--ink);color:var(--card);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:500;line-height:1.3;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}.top .burger[data-tip]:hover::after{right:auto;left:0}}
.ib .pip{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--exp)}
.me{display:flex;align-items:center;gap:10px;padding:3px 8px 3px 4px;font-weight:600;font-size:14px;border-radius:999px;color:var(--ink)}.me:hover{background:var(--soft)}
.av{width:38px;height:38px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.burger{display:none}
main{padding:clamp(16px,2.4vw,28px);display:flex;flex-direction:column;gap:20px;max-width:1500px;width:100%;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sub{color:var(--mute);font-size:14px;margin-top:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.btn{background:var(--btn);color:#fff;padding:10px 18px;border-radius:11px;font-weight:600;min-height:44px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.gh{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sf{background:var(--pri2);color:var(--pri)}
.btn.rd{background:none;color:var(--exp);border:1px solid var(--line)}
.btn.big{width:100%;font-size:17px;padding:15px;min-height:54px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--card);min-height:46px}
label{font-size:13px;color:var(--mute);display:grid;gap:5px;font-weight:500}
.tabs{display:inline-flex;background:var(--soft);border-radius:11px;padding:4px;gap:2px;flex-wrap:wrap}
.tabs button{padding:7px 13px;border-radius:8px;font-size:14px;font-weight:600;color:var(--mute);min-height:36px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;min-height:40px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--pri2);color:var(--pri);white-space:nowrap;font-weight:600;font-style:normal;display:inline-block}
.tag.g{background:color-mix(in srgb,var(--inc) 15%,transparent);color:var(--inc)}.tag.r{background:color-mix(in srgb,var(--exp) 15%,transparent);color:var(--exp)}.tag.y{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.up{color:var(--inc)}.dn{color:var(--exp)}
.empty{color:var(--mute);text-align:center;padding:28px 10px}
.note{font-size:13px;color:var(--mute)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.kpi[data-k]{cursor:pointer;transition:transform .12s,box-shadow .12s}.kpi[data-k]:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-1px)}.kpi[data-k]:active{transform:scale(.98)}
.kpi[data-k] .d::after{content:' ›';opacity:.5}
.kpi .l{font-size:12.5px;font-weight:600;color:var(--mute)}
.kpi .v{font-size:clamp(22px,2.2vw,28px);font-weight:800;white-space:nowrap;letter-spacing:-.02em}
.kpi .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;grid-row:span 2}
.kpi .d{grid-column:1/-1;font-size:13px;color:var(--mute)}.kpi .d b{font-weight:600}
/* Ticker */
.tick{overflow:hidden;padding:0;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tick .tr{display:flex;width:max-content;animation:tk 50s linear infinite}
.tick:hover .tr{animation-play-state:paused}
.tick .ti{display:flex;align-items:center;gap:10px;padding:16px 22px;border-right:1px solid var(--line);white-space:nowrap;font-size:14px}
.tick .ti b{font-weight:600}
.tick .mini{width:40px;height:40px;border-radius:10px;overflow:hidden;flex:none;background:var(--soft)}.tick .mini img,.tick .mini svg{width:100%;height:100%;object-fit:cover;display:block}
.tick .ti{padding-block:12px}
@keyframes tk{to{transform:translateX(-50%)}}
/* Rejillas del panel */
.g21{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:16px}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.85fr);gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.big{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.leg{display:flex;gap:16px;font-size:13px;color:var(--mute);flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.fig{position:relative;height:300px;margin-top:8px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);padding:8px 11px;border-radius:10px;font-size:12.5px;line-height:1.45;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.lst{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .th{width:44px;height:44px;border-radius:12px;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-weight:700}
.li b{display:block;font-weight:600}.li small{color:var(--mute);font-size:13px}
.li .rt{text-align:right;white-space:nowrap}.li .rt b{font-weight:700}
.donut{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:center}
.donut svg{width:170px;height:170px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar .h{display:flex;justify-content:space-between;gap:8px;font-size:14px}.bar .h span:last-child{font-weight:600;white-space:nowrap}
.trk{height:9px;border-radius:6px;background:var(--soft);margin-top:6px;overflow:hidden}.trk i{display:block;height:100%;border-radius:6px;background:var(--pri)}
/* Tablas */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12.5px;color:var(--mute);font-weight:600;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.ck{cursor:pointer}tr.ck:hover td{background:var(--soft)}
.pc{display:flex;align-items:center;gap:10px}.pc .th{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:none;background:var(--soft)}
.th img,.th svg,.ph2 img,.ph2 svg{width:100%;height:100%;object-fit:cover;display:block}
.spk{width:96px;height:30px;display:block;margin-left:auto}
.scroll{overflow-x:auto}
/* Piezas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.it{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.it:hover{transform:translateY(-3px);box-shadow:0 16px 34px -20px rgba(30,30,90,.45)}
.ph2{aspect-ratio:1;background:var(--soft);position:relative;overflow:hidden}
.ph2 .offb{position:absolute;bottom:8px;right:8px;height:30px;padding:0 10px;border-radius:999px;display:flex;align-items:center;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12px;font-weight:600;color:var(--mute);cursor:pointer;z-index:2}.ph2 .offb:hover{color:var(--ink)}.it.isoff .ph2>img,.it.isoff .ph2>svg{opacity:.45;filter:grayscale(1)}
.ph2 .tag{position:absolute;top:10px;left:10px;box-shadow:0 2px 8px rgba(0,0,0,.12);background:var(--card)}
.ph2 .ctag{position:absolute;top:10px;right:10px;left:auto;max-width:48%;overflow:hidden;text-overflow:ellipsis;background:var(--pri);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.ctag2{background:var(--pri);color:#fff;font-size:13px;padding:4px 11px}
.it .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.it b{font-weight:600;line-height:1.3}.it .mt{font-size:13px;color:var(--mute)}
.it .pr{margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;align-items:center}
.it .pr span{font-size:18px;font-weight:800;white-space:nowrap}
.plus{width:36px;height:36px;border-radius:11px;background:var(--btn);color:#fff;font-size:22px;display:grid;place-items:center;flex:none}
.it.off{opacity:.5}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-left:4px solid var(--pri)}
.sm .l{font-size:12px;font-weight:600;color:var(--mute)}.sm .v{font-size:22px;font-weight:800;white-space:nowrap}
/* Vender */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.scan{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.scan input{flex:1 1 200px}
.opts{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--mute);padding:0 4px}
.opts label{display:flex;flex-direction:row;align-items:center;gap:7px;font-size:13.5px}
.opts input{width:18px;height:18px;min-height:0}
.last{background:color-mix(in srgb,var(--inc) 12%,var(--card));border:1px solid color-mix(in srgb,var(--inc) 30%,transparent);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ticket{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
.lines{display:flex;flex-direction:column;max-height:36vh;overflow:auto}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.ln .n{font-weight:600;font-size:14.5px}.ln .u{font-size:12.5px;color:var(--mute)}
.qty{display:flex;align-items:center;background:var(--soft);border-radius:10px}
.qty button{width:34px;height:36px;font-size:19px;font-weight:700;color:var(--pri)}
.qty span{min-width:24px;text-align:center;font-weight:700}
.ln .t{font-weight:700;white-space:nowrap;text-align:right;min-width:66px}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:6px}
.pay button{padding:9px 2px;border-radius:11px;border:1px solid var(--line);font-weight:600;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
.pay button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tot{display:flex;justify-content:space-between;align-items:baseline}.tot b{font-size:32px;font-weight:800;white-space:nowrap;letter-spacing:-.02em}
.mcart{display:none}
.matbox{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.mathd{display:grid;gap:2px}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) 110px auto;gap:10px;align-items:end}.msw{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-bottom:12px}.mdel{min-height:46px;padding:0 14px}
.mother{grid-column:2/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.costbox{display:grid;gap:8px}
@media(max-width:600px){.mrow{grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}.mrow:last-child{border-bottom:0}.mfil{grid-column:2/-1}.mg{grid-column:2}.mdel{grid-column:3}.mother{grid-column:1/-1;grid-template-columns:1fr 1fr}}
.brow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,.8fr) 40px;gap:6px;align-items:center}.brow input{min-width:0}.brow .btn{padding:0;min-height:38px}.vchip:not(:has(.cdots)){padding-left:8px}
@media(max-width:640px){.brow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 40px}.brow>input:first-child{grid-column:1/-1}.note.brow>span:first-child{display:none}.brow+.brow{border-top:1px solid var(--line);padding-top:8px}#blist .brow input{padding-left:10px;padding-right:6px}}
.vchip{display:inline-flex;align-items:center;gap:2px;font-size:12px;padding:2px 8px 2px 2px;border-radius:999px;background:var(--soft);margin:2px 4px 2px 0}.vchip .cdots{margin-left:4px}.vchip.off{opacity:.55}.vpick{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.vpick .btn{justify-content:flex-start;gap:8px}.vpick small{margin-left:auto;opacity:.75}.vpick .btn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vpick small{white-space:nowrap;flex:none}.vrow{display:grid;grid-template-columns:minmax(0,1fr) 90px 40px;gap:8px;align-items:center}
.cdots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}.cdots i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);display:block}.cdots.big i{width:16px;height:16px}#pdots .cdots{margin-left:2px}
.ctxm{position:fixed;z-index:200;min-width:190px;max-width:280px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;display:grid}.ctxm button{all:unset;cursor:pointer;padding:11px 12px;border-radius:8px;font-size:15px}.ctxm button:hover,.ctxm button:focus-visible{background:var(--soft)}.ctxh{padding:8px 12px 6px;font-size:13px;color:var(--mute);border-bottom:1px solid var(--line);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.fchip b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fchip .btn{min-height:40px;padding:0 14px}.filebtn.busy{opacity:.6;pointer-events:none}.fcn{min-width:0;flex:1}.fchip a.btn{text-decoration:none}@media(max-width:600px){.fchip{flex-wrap:wrap}.fcn{flex:1 1 calc(100% - 40px)}.fchip a.btn{flex:1;justify-content:center}}
/* Diseños */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{background:var(--soft);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.col h2{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:2px 4px}
.dz{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:14px;text-align:left;background:var(--card);border:1px solid var(--line)}
.dz .ph2{border-radius:10px}.dz b{display:block;font-weight:600;line-height:1.3}
/* Ticket térmico */
.rc{background:#fff;color:#111;font:13px/1.55 ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;padding:22px 20px;border-radius:6px;box-shadow:0 12px 30px -16px rgba(0,0,0,.4);max-width:340px;margin:0 auto;width:100%}
.rc .c{text-align:center}.rc .r{display:flex;justify-content:space-between;gap:10px}.rc hr{border:0;border-top:1px dashed #999;margin:10px 0}
.rc .T{font-weight:700;font-size:16px}
.qt{background:#fff;color:#111;padding:28px;font-size:14px;line-height:1.5}.qt table{color:#111}.qt th,.qt td{color:#111;border-bottom:1px solid #ddd;padding:8px}.qt h3{color:#111}.rc svg{width:100%;height:56px;display:block;margin-top:10px}
.tks{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.tks .prev{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(8,10,25,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
.ov.show{display:flex}
.dlg{background:var(--card);border-radius:20px;padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg.w{width:min(880px,100%)}
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.det .ph2{border-radius:16px}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}.specs dt{color:var(--mute)}.specs dd{margin:0;font-weight:600}
.codes{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:12px}
.codes img{width:92px;height:92px;background:#fff;border-radius:8px;flex:none;image-rendering:pixelated}
.wbox{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--pri) 6%,transparent)}.wh{display:flex;gap:8px;align-items:center;color:var(--pri)}.wh .i{width:18px;height:18px}.wres{display:grid;gap:4px}.wbig{font-size:15px;font-weight:700;color:var(--pri)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.upbar{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:95;display:flex;align-items:center;gap:12px;background:var(--pri);color:#fff;padding:10px 10px 10px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 24px);width:max-content;animation:upin .3s ease}
.upbar .upt{display:grid;gap:2px;font-size:14px;line-height:1.3}.upbar .upt span{opacity:.9;font-size:13px}.upbar .btn{background:#fff;color:var(--pri);border-color:#fff;flex:none}.upbar .ib{color:#fff;background:transparent;border-color:rgba(255,255,255,.4);flex:none}
@keyframes upin{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translateX(-50%)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,160px);background:var(--ink);color:var(--card);padding:12px 20px;border-radius:12px;font-weight:600;transition:transform .25s;z-index:70;max-width:90vw}
.toast:not(.show){visibility:hidden}.toast.show{transform:translate(-50%,0)!important}
.bnav,.more{display:none}
/* Responsive */
@media(max-width:1200px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:minmax(0,1fr)}.pos,.tks{grid-template-columns:minmax(0,1fr) 340px}}

 .det{grid-template-columns:minmax(0,1fr)}

}

<script>
{
/* ======================= ESTADO ======================= */
const S={products:[],customers:[],collabs:[],sales:[],expenses:[],prints:[],moves:[],spools:[],farm:[],farmlog:[],queue:[],farmLive:{},farmEnabled:false,fmOpen:'',fmq:'',fmf:'todas',
 cfg:{name:'Mi taller 3D',owner:'Yo',currency:'EUR',printers:['Impresora 1','Impresora 2'],fleet:[],footer:'¡Gracias por tu compra!',phone:'',logo:'',vat:0,vatIncl:true,kwh:0.18,labor:15,margin:60,fail:5,cats:[],email:''},
 view:'panel',cart:[],cat:'Todas',q:'',pay:'Efectivo',cust:'',seller:'',cash:'',range:30,layout:'galeria',scanMode:'vender',beep:true,askQty:false,last:null,
 tkq:'',tksel:'',mvf:'todos',gcat:'Todas',who:'clientes',lowOnly:false,appusers:[],profiles:[],jobs:[],quotes:[],jobf:'abiertos',qtab:'calc',garea:'todas',calc:null};

const D=864e5,day0=t=>{const d=new Date(t);d.setHours(0,0,0,0);return +d};

const fdt=t=>new Date(t).toLocaleString(T3D_LOCALE,{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const uid=()=>'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ico=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;

const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)};
const status=(ok,txt)=>{$('#dot').className='dot'+(ok?' ok':'');$('#stt').textContent=txt};

const catalog=()=>S.products.filter(p=>(p.estado||'listo')==='listo'&&!p.off);
/* Desactivadas: piezas o productos que por ahora no vas a hacer ni vender. No salen en Vender, ni en los avisos, ni en el bot; se ven con «Desactivadas» */
const offAll=()=>S.products.filter(p=>(p.estado||'listo')==='listo'&&p.off);
function offFiltered(kind){const q=S.q.toLowerCase();return offAll().filter(p=>(kind==='productos'?isRes(p):!isRes(p))&&(!q||[p.name,p.code,p.material,p.color,p.cat].some(v=>String(v||'').toLowerCase().includes(q)))).sort((a,b)=>a.name.localeCompare(b.name))}

const offCell=p=>`<td class="n"><button class="btn gh" data-toff="${esc(p.id)}" style="min-height:32px;padding:2px 10px;font-size:12px">${p.off?'Activar':'Desactivar'}</button></td>`;
const offToggle=(kind,n)=>n||S.showOff?`<button class="btn ${S.showOff?'':'gh'}" data-showoff style="min-height:40px">${S.showOff?'← Volver a las activas':kind==='productos'?'Desactivados ('+n+')':'Desactivadas ('+n+')'}</button>`:'';
const offNote=kind=>S.showOff?`<div class="last" style="background:var(--soft)"><span><b>${kind==='productos'?'Productos desactivados':'Piezas desactivadas'}</b><small class="note" style="display:block">No salen en Vender, ni en «Por reponer», ni en los avisos ni en el bot de Telegram. Pulsa «Activar» para volver a usarlas.</small></span></div>`:'';
async function toggleOff(id){const p=S.products.find(x=>x.id===id);if(!p||!roOK('products'))return;const off=!p.off;
 try{await patch('products',id,{off});if(off)S.cart=S.cart.filter(l=>l.custom||l.id!==id);if($('#ov').classList.contains('show')&&$('#dlg [data-toff]'))closeModal();render();toast((off?'Desactivada: ':'Activada: ')+p.name)}catch(e){toast('No se pudo cambiar')}}
const okSales=()=>S.sales.filter(s=>s.status!=='anulado'&&s.status!=='pendiente');
/* Margen del colaborador: lo que se lleva él de cada pieza que vende. myPart(s) = tu parte de la venta */
const myPart=s=>(+s.total||0)-(+s.commission||0);
const collabOf=id=>id?S.collabs.find(c=>c.id===id):null;
const cutUnit=(c,price)=>{if(!c||!(+c.margin>0))return 0;const v=c.marginType==='pct'?price*c.margin/100:+c.margin;return +Math.max(v,0).toFixed(2)};
const linePrice=l=>{const c=collabOf(S.seller);return +((+l.price||0)+(c&&c.marginMode==='suma'&&!l.custom?cutUnit(c,+l.price||0):0)).toFixed(2)};
const marginLabel=c=>!c||!(+c.margin>0)?'':c.marginType==='pct'?num(c.margin,1)+' %':money(c.margin)+' '+T('por pieza');
const owedSales=()=>S.sales.filter(s=>s.status==='pendiente');
const sDate=s=>s.paidAt||s.date;
const isLow=p=>!p.noRestock&&(+p.stock||0)<=(+p.min||0);
const lowList=()=>catalog().filter(isLow);
/* Productos de reventa (pilas, cables…): se compran hechos en packs y se venden sueltos. Van en S.products con kind:'reventa' */
const isRes=p=>!!p&&p.kind==='reventa';
const pieces=()=>catalog().filter(p=>!isRes(p));
const resales=()=>catalog().filter(isRes);
const unitCost=(pp,pu)=>+pu>0?+((+pp||0)/(+pu)).toFixed(4):0;
const itemRes=i=>i&&(i.kind==='reventa'||isRes(S.products.find(p=>p.id===i.pid)));
const money3=n=>{const v=+n||0;if(Math.abs(v*100-Math.round(v*100))<1e-6)return money(v);try{return new Intl.NumberFormat(T3D_LOCALE,{style:'currency',currency:S.cfg.currency||'EUR',minimumFractionDigits:2,maximumFractionDigits:3}).format(v)}catch(e){return money(v)}};
const nextRCode=()=>'R-'+String(Math.max(0,...S.products.map(p=>+(String(p.code||'').match(/^R-(\d+)$/)||[0,0])[1]))+1).padStart(4,'0');
function resStats(from){let u=0,inc=0,gan=0;const by={};okSales().forEach(s=>{if(sDate(s)<from)return;(s.items||[]).forEach(i=>{if(!itemRes(i))return;const q=+i.qty||0,net=(+i.price||0)-(+i.commission||0);u+=q;inc+=q*net;gan+=q*(net-(+i.cost||0));const b=by[i.pid]=by[i.pid]||{u:0,gan:0};b.u+=q;b.gan+=q*(net-(+i.cost||0))})});return {u,inc,gan,by}}
const photo=p=>{if(p&&p.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(p.photo))return `<img src="${p.photo}" alt="" loading="lazy">`;
 const c=catColor(p&&p.cat);return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="${c}" opacity=".13"/><path d="M50 24 27 36.5v27L50 76l23-12.5v-27z" fill="${c}"/><path d="M50 49 27 36.5 50 24l23 12.5z" fill="#fff" opacity=".45"/><path d="M50 49v27l23-12.5v-27z" fill="#000" opacity=".16"/></svg>`};
const stockTag=p=>{const s=+p.stock||0;return s<=0?'<em class="tag r">Agotado</em>':isLow(p)?`<em class="tag y">Quedan ${num(s)}</em>`:`<em class="tag g">${num(s)} en stock</em>`};
/* Piezas que se venden en varios colores: cada color con su stock (p.variants=[{color,stock}]); p.stock es siempre la suma */
const hasVars=p=>!!p&&Array.isArray(p.variants)&&p.variants.length>0;
const varStock=(p,c)=>{const v=hasVars(p)&&p.variants.find(x=>x.color===c);return v?(+v.stock||0):0};
const vdot=c=>{const h=colorHex({color:c});return `<span class="cdots"><i style="background:${!h?'var(--line)':h==='transparent'?'repeating-linear-gradient(45deg,#ddd 0 3px,#fff 3px 6px)':h}"></i></span>`};
const varsLine=p=>hasVars(p)?p.variants.map(v=>`<span class="vchip${(+v.stock||0)>0?'':' off'}">${vd(p,v.color)}${esc(v.color)} <b>${num(v.stock)}</b></span>`).join(''):'';
function pickColor(p,needStock){return new Promise(ok=>{
 modal(`<h2>${isRes(p)?'¿De qué marca?':'¿De qué color?'}</h2><div class="sub">${esc(p.name)}</div><div class="vpick">${p.variants.map((v,k)=>`<button type="button" class="btn sf" data-vk="${k}" ${needStock&&!((+v.stock||0)>0)?'disabled':''}>${vd(p,v.color)}<span>${esc(v.color)}</span><small>${num(v.stock)} ud</small></button>`).join('')}</div><div class="acts"><button type="button" class="btn gh" data-close>Cancelar</button></div>`);
 const d=$('#dlg');d.onclick=e=>{const b=e.target.closest('[data-vk]');if(!b)return;d.onclick=null;const c=p.variants[+b.dataset.vk].color;closeModal();ok(c)}})}
const colorSel=(p,name='vcolor')=>hasVars(p)?`<label>${isRes(p)?'Marca':'Color'}<select name="${name}">${p.variants.map(v=>`<option value="${esc(v.color)}">${esc(v.color)} · ${num(v.stock)} ud</option>`).join('')}</select></label>`:'';
/* Productos de reventa con varias marcas: usan las mismas variantes (color = nombre de la marca) y cada marca lleva su pack: packPrice, packUnits y cost */
const vd=(p,c)=>isRes(p)?'':vdot(c);
const pidOf=id=>S.products.find(x=>x.id===id);
const brandCost=(p,c)=>{const v=hasVars(p)&&p.variants.find(x=>x.color===c);return v&&v.cost!=null&&v.cost!==''?+v.cost:(+p.cost||0)};
const avgCost=vs=>{const t=vs.reduce((a,v)=>a+(+v.stock||0),0),w=vs.filter(v=>+v.cost>0);return t?+(vs.reduce((a,v)=>a+(+v.cost||0)*(+v.stock||0),0)/t).toFixed(4):w.length?+(w.reduce((a,v)=>a+(+v.cost),0)/w.length).toFixed(4):0};
const qrURL=t=>{try{const q=qrcode(0,'M');q.addData(String(t));q.make();return q.createDataURL(6,2)}catch(e){return ''}};
const nextCode=()=>'P-'+String(Math.max(0,...S.products.map(p=>+(String(p.code||'').match(/^P-(\d+)$/)||[0,0])[1]))+1).padStart(4,'0');
/* códigos por categoría: LLV-001, IMN-001… (prefijo editable en «Categorías») */
const CAT_PRE=[[/^llaver/,'LLV'],[/^iman/,'IMN'],[/^figur|^copa|^trofeo/,'FIG'],[/^navid/,'NAV'],[/^pila/,'PIL'],[/^cable/,'CAB'],[/^cargad/,'CRG'],[/^bater/,'BAT'],[/^reloj/,'REL'],[/^mascot/,'MAS'],[/^decora/,'DEC'],[/^hogar/,'HOG'],[/^regalo/,'REG'],[/^escritor/,'ESC'],[/^repuest/,'REP'],[/^dise/,'DIS'],[/^otro/,'OTR'],[/^producto/,'PRD'],[/^impresi/,'IMP'],[/^foto/,'FOT']];
const ntxt=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function autoPre(cat){const n=ntxt(cat);for(const [r,p] of CAT_PRE)if(r.test(n))return p;const w=(n.match(/[a-z0-9]{2,}/)||['pza'])[0];return (w+'xx').slice(0,3).toUpperCase()}
const cleanPre=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
function catPre(cat,m=S.cfg.catPre||{}){const k=Object.keys(m).find(x=>ntxt(x)===ntxt(cat));return cleanPre(k?m[k]:'')||autoPre(cat||'Otros')}
const isAutoCode=c=>!c||c==='0'||/^[A-Z0-9]{2,6}-\d{3,}$/.test(String(c));
function codeFor(cat,taken,m){const pre=catPre(cat,m),re=new RegExp('^'+pre+'-(\\d+)$','i');let mx=0;for(const c of (taken||S.products.flatMap(p=>[p.code,...(p.oldCodes||[])]))){const x=String(c||'').match(re);if(x)mx=Math.max(mx,+x[1])}return pre+'-'+String(mx+1).padStart(3,'0')}

const nextNum=()=>Math.max(0,...S.sales.map(s=>+s.num||0))+1;
/* Fecha de la venta: vacía = ahora. Con fecha pasada (para pasar ventas antiguas) se puede no tocar el stock. */
const dtLocal=ms=>{const d=new Date(ms);return new Date(ms-d.getTimezoneOffset()*6e4).toISOString().slice(0,16)};
const saleWhen=()=>{const t=S.sdate?new Date(S.sdate).getTime():NaN;return isFinite(t)&&t<Date.now()-6e5?t:0};
const pastFree=()=>!!saleWhen()&&!S.sstock;
const tnum=n=>'#'+String(n||0).padStart(4,'0');
const collabName=id=>id?((S.collabs.find(c=>c.id===id)||{}).name||'Colaborador'):(S.cfg.owner||'Yo');
const sel=(v,opts)=>opts.map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(v)?'selected':''}>${esc(l)}</option>`).join('');
const PAYS=[['Efectivo','cash'],['Tarjeta','card'],['Bizum','phone'],['Transferencia','bank']];
const PAYS_POS=[...PAYS,['A deber','clock']];

/* ======================= TEMA ======================= */
const isDark=()=>document.documentElement.classList.contains('dark');
function themeIcon(){$('#thi').setAttribute('href',isDark()?'#i-sun':'#i-moon');const b=$('#theme');if(b){const t=isDark()?'Cambiar a modo claro':'Cambiar a modo oscuro';b.dataset.tip=t;b.setAttribute('aria-label',t)}}
function toggleTheme(){const m=isDark()?'light':'dark';window.__mode=m;try{localStorage.setItem('t3d-mode',m)}catch(e){}__applyMode();themeIcon();render()}

/* ======================= DATOS ======================= */
const roOK=col=>{if(!ME)return true;if(ME.role==='lector'&&!['profiles','appusers'].includes(col)){toast('Tu usuario solo puede ver, no cambiar datos');return false}return true};
async function put(col,id,d){if(!roOK(col))throw {code:'invalid_argument'};
 try{if(db){if(id)await db.doc(col+'/'+id).set(d);else{const r=await db.collection(col).add(d);return r.id}}
  else{if(id){const o=S[col].find(x=>x.id===id);if(o){Object.keys(o).forEach(k=>k!=='id'&&delete o[k]);Object.assign(o,d)}}else{const n={...d,id:uid()};S[col].unshift(n);render();return n.id}render()}}
 catch(e){toast(e&&e.code==='quota_exceeded'?'La base de datos está llena':'No se pudo guardar');throw e}
 return id;
}
async function patch(col,id,d){if(!roOK(col))throw {code:'invalid_argument'};if(db)await db.doc(col+'/'+id).update(d);else{Object.assign(S[col].find(x=>x.id===id)||{},d);render()}}
async function del(col,id){if(!roOK(col))return;try{if(db)await db.doc(col+'/'+id).delete();else{S[col]=S[col].filter(x=>x.id!==id);render()}}catch(e){toast('No se pudo borrar')}}
/* Kardex: todo cambio de stock deja un movimiento */
async function stockMove(p,delta,type,ref,extra={}){if(!roOK('products'))throw {code:'invalid_argument'};
 const before=+p.stock||0;let after,upd,col='';delta=Math.round(delta);
 if(hasVars(p)){const vs=p.variants.map(v=>({...v,stock:+v.stock||0})),c=extra.color;let v=c?vs.find(x=>x.color===c):null;
  if(c&&!v){v={color:c,stock:0};vs.push(v)}
  if(!v&&delta>=0)v=vs[0];
  if(v){v.stock=Math.max(0,v.stock+delta);col=v.color}
  else{let left=-delta;for(const x of vs.slice().sort((a,b)=>b.stock-a.stock)){const t=Math.min(x.stock,left);x.stock-=t;left-=t;if(!left)break}}
  after=vs.reduce((t,x)=>t+x.stock,0);p.variants=vs;upd={stock:after,variants:vs}}
 else{after=Math.max(0,before+delta);upd={stock:after}}
 p.stock=after;const {color:_c,...rest}=extra;
 const mv={date:Date.now(),pid:p.id,name:p.name,type,qty:after-before,before,after,ref:ref||'',...rest,...(col?{color:col}:{})};
 if(db){await db.doc('products/'+p.id).update(upd);await db.collection('moves').add(mv)}else{S.moves.unshift({...mv,id:uid()})}
}
async function spoolMove(sp,grams){if(!roOK('spools'))return;const left=Math.max(0,Math.round((+sp.left||0)+grams));sp.left=left;if(db)await db.doc('spools/'+sp.id).update({left});}
async function saveFile(filename,text,type){

function period(days){const now=Date.now();if(!days){const all=[...S.sales.map(s=>s.date),...S.expenses.map(s=>s.date),...S.jobs.map(s=>s.date)];const first=all.length?Math.min(...all):now-30*D;return {from:day0(first),to:now,prevFrom:0,prevTo:0}}const from=day0(now)-(days-1)*D;return {from,to:now,prevFrom:from-days*D,prevTo:from}}
const inR=(t,a,b)=>t>=a&&t<b+1;
function totals(a,b){const s=okSales().filter(x=>inR(sDate(x),a,b)),e=S.expenses.filter(x=>inR(x.date,a,b)),j=S.jobs.filter(x=>x.paid&&inR(x.payDate||x.date,a,b)),jc=S.jobs.filter(x=>inR(x.date,a,b));
 const incS=s.reduce((t,x)=>t+myPart(x),0),comm=s.reduce((t,x)=>t+(+x.commission||0),0),incJ=j.reduce((t,x)=>t+(+x.price||0),0),expE=e.reduce((t,x)=>t+(+x.amount||0),0),jcost=jc.reduce((t,x)=>t+jobCost(x),0),expJ=jcost+e.filter(x=>x.area==='informatica').reduce((t,x)=>t+(+x.amount||0),0),units=s.reduce((t,x)=>t+(+x.units||0),0);
 const incR=s.reduce((t,x)=>t+(x.items||[]).filter(itemRes).reduce((a,i)=>a+(+i.qty||0)*((+i.price||0)-(+i.commission||0)),0),0),expR=e.filter(x=>x.area==='reventa').reduce((t,x)=>t+(+x.amount||0),0);
 const inc=incS+incJ,exp=expE+jcost;
 return {s,e,j,jc,inc,exp,incS,comm,incJ,expJ,incR,expR,exp3d:exp-expJ-expR,net:inc-exp,units,n:s.length,avg:s.length?incS/s.length:0}}

function buckets(days){const {from,to}=period(days);const span=(to-from)/D;
 let unit=span<=14?'d':span<=120?'w':'m',out=[];
 if(unit==='d'){for(let t=from;t<=to;t+=D)out.push({a:t,b:t+D-1,l:new Date(t).toLocaleDateString(T3D_LOCALE,{day:'numeric',month:'short'})})}

 else{const d=new Date(from);d.setDate(1);while(+d<=to){const a=+d;d.setMonth(d.getMonth()+1);out.push({a,b:+d-1,l:new Date(a).toLocaleDateString(T3D_LOCALE,{month:'short',year:'2-digit'})})}}

const farmCode=f=>f.code||('IMP-'+String(f.n||0).padStart(4,'0'));
const farmLive=id=>(S.farmLive[id]||{}).live||null;

function farmState(f){const l=farmLive(f.id);
 if(l&&l.online){const s=LIVEST[l.state]||[l.state||'Conectada','var(--pri)'];return {t:s[0],c:s[1],live:true,l}}
 const m=FST[f.status||'libre']||FST.libre;return {t:m[0],c:m[1],live:false,l}}
const fmtMin=m=>m==null?'':m>=60?Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min':m+' min';
async function fetchFarmLive(){if(IN_ARTIFACT)return;try{const r=await api('GET','api/farm/live');S.farmEnabled=!!r.enabled;S.farmCloud=r.cloud||null;S.farmLive=r.printers||{};render();paintFarmModal()}catch(e){}}
function onFarmLive(m){if(!m||!m.id)return;S.farmLive[m.id]={...(S.farmLive[m.id]||{hasAccess:true}),live:m.live};if(S.view==='granja'||S.view==='taller')render();paintFarmModal()}
function farmTrays(l){return (l&&l.trays||[]).map(t=>`<span title="${esc(t.type)}${t.remain!=null&&t.remain>=0?' · '+t.remain+'%':''}" style="display:inline-flex;align-items:center;gap:4px;font-size:12px"><i style="width:14px;height:14px;border-radius:50%;background:${/^#[0-9a-f]{6}$/i.test(t.color)?t.color:'#888'};border:1px solid var(--line)"></i>${esc(t.type||'?')}</span>`).join(' ')}
const FMF=[['todas','Todas'],['trabajando','Trabajando'],['libres','Libres'],['aviso','Con aviso']];
const fmMatch=(k,s)=>k==='trabajando'?/Imprimiendo|Preparando|pausa/.test(s.t):k==='libres'?(s.t==='Libre'||s.t==='Terminada'):k==='aviso'?/Averiada|Fallida|Mantenimiento/.test(s.t)||!!(s.l&&(s.l.errors||s.l.printError)):true;
function vGranja(){
 const all=S.farm.slice().sort((a,b)=>(a.n||0)-(b.n||0)),stAll=all.map(farmState);
 const qq=(S.fmq||'').toLowerCase(),idx=all.map((f,i)=>i).filter(i=>fmMatch(S.fmf||'todas',stAll[i])&&(!qq||[all[i].name,all[i].model,farmCode(all[i]),all[i].job,all[i].notes].join(' ').toLowerCase().includes(qq)));
 const l=idx.map(i=>all[i]),st=idx.map(i=>stAll[i]);
 const busy=stAll.filter(s=>/Imprimiendo|Preparando|pausa/.test(s.t)).length,free=stAll.filter(s=>s.t==='Libre'||s.t==='Terminada').length,bad=stAll.filter(s=>/Averiada|Fallida|Mantenimiento/.test(s.t)).length,lan=all.filter(f=>f.lan||f.net).length;
 return `<div class="ph"><div><h1>Granja de impresoras</h1><div class="sub">Cada impresora con su QR: escanéalo para ver qué está haciendo, cambiar su estado o controlarla</div></div>
 <div class="btns"><button class="btn gh" id="bcloud">${S.farmCloud?'☁ Nube Bambu ✓':'☁ Nube Bambu'}</button><button class="btn gh" id="kgo">Modo taller</button><button class="btn gh" id="fmlab">${ico('qr')}Etiquetas QR</button><button class="btn gh" id="bulkfm">+ Varias</button><button class="btn" id="newfm">+ Añadir impresora</button></div></div>
 <div class="sum"><div class="sm"><div class="l">Impresoras</div><div class="v">${all.length}</div></div><div class="sm" style="border-left-color:var(--pri)"><div class="l">Trabajando</div><div class="v">${busy}</div></div><div class="sm" style="border-left-color:var(--inc)"><div class="l">Libres</div><div class="v">${free}</div></div><div class="sm" style="border-left-color:var(--exp)"><div class="l">Paradas o con aviso</div><div class="v ${bad?'dn':''}">${bad}</div></div></div>
 ${DEMO?`<p class="note" style="margin:0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink)"><b>Demo:</b> estas 10 impresoras son simuladas y van rápido (1 segundo = 1 minuto). Terminan, fallan y empiezan trabajos solas; puedes pausarlas, pararlas, cambiar la luz o la velocidad. Nada se conecta a impresoras reales.</p>`:IN_ARTIFACT?`<p class="note" style="margin:0">Aquí llevas el estado de cada impresora a mano. El control en directo de las Bambu Lab por LAN (progreso, temperaturas, pausar, parar…) funciona en la versión instalada en tu red (Docker o servidor de casa).</p>`
  :lan&&!S.farmEnabled?`<p class="note" style="margin:0">El control LAN está desactivado en este servidor (FARM_LAN=0).</p>`:''}
 ${all.length>6?`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><input id="fmq" placeholder="Buscar impresora, código, modelo o trabajo…" value="${esc(S.fmq||'')}" autocomplete="off" style="flex:1 1 240px"><div class="tabs">${FMF.map(([k,t])=>`<button data-fmf="${k}" class="${(S.fmf||'todas')===k?'on':''}">${t}</button>`).join('')}</div></div>`:''}
 <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${l.length?l.map((f,i)=>{const s=st[i],lv=s.l,pct=lv&&lv.online&&lv.percent!=null?Math.max(0,Math.min(100,lv.percent)):null;
  return `<button class="card" data-fm="${esc(f.id)}" style="text-align:left;display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;gap:12px;align-items:center"><div style="width:56px;height:56px;flex:none;background:var(--soft);border-radius:12px;overflow:hidden">${prPic(f)}</div><div style="min-width:0;flex:1"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</b><div class="note" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc([farmCode(f),f.model,(f.ams||[]).length?((f.ams.length>1?f.ams.length+'× ':'')+f.ams[0].type):''].filter(Boolean).join(' · '))}</div><span class="tag" style="margin-top:4px;background:color-mix(in srgb,${s.c} 16%,transparent);color:${s.c}">${s.live?'● ':''}${esc(s.t)}</span></div></div>
  ${pct!=null&&/Imprimiendo|pausa|Preparando/.test(s.t)?`<div class="bar"><div class="h"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(lv.file||'Imprimiendo')}</span><span>${pct}%</span></div><div class="trk"><i style="width:${pct}%"></i></div></div><div class="note">Quedan ${fmtMin(lv.remaining)}${lv.layers?' · capa '+lv.layer+'/'+lv.layers:''}</div>`
   :f.job&&f.status==='imprimiendo'?`<div class="note">${ico('clock')} ${esc(f.job)}${f.since?' · desde '+fdt(f.since):''}</div>`:''}
  ${lv&&lv.online?`<div class="note">Boquilla ${num(lv.nozzle||0)}°${lv.nozzleT?'/'+num(lv.nozzleT)+'°':''} · Cama ${num(lv.bed||0)}°${lv.chamber?' · Cámara '+num(lv.chamber)+'°':''}</div>${lv.trays&&lv.trays.length?`<div style="display:flex;gap:8px;flex-wrap:wrap">${farmTrays(lv)}</div>`:''}`
   :(f.lan||f.cloud||f.net)&&(!IN_ARTIFACT||DEMO)?`<div class="note" style="color:var(--exp)">${esc(lv&&lv.error||(f.cloud?(S.farmCloud?'Esperando datos de la nube…':'Conecta tu cuenta en «Nube Bambu»'):f.net||S.farmLive[f.id]&&S.farmLive[f.id].hasAccess?'Conectando…':'Falta el código de acceso LAN'))}</div>`:''}
  </button>`}).join(''):`<div class="card empty" style="grid-column:1/-1">${all.length?'Ninguna impresora coincide.':'Añade tus impresoras. A cada una se le da un código (IMP-0001, IMP-0002…) con su QR para pegarlo en la máquina.'}</div>`}</div>
 ${all.length?(()=>{const {from}=period(S.range),rl=RANGES.find(x=>x[0]===S.range)[1],tot=farmStats('',from||0);
  return `<div class="g21"><div class="card"><div class="ch"><h2>Estadísticas</h2><div class="tabs">${RANGES.map(([v,t])=>`<button data-range="${v}" class="${v===S.range?'on':''}">${t}</button>`).join('')}</div></div>
  <div class="sum" style="margin-bottom:12px"><div class="sm"><div class="l">Horas imprimiendo</div><div class="v">${num(tot.hours,1)} h</div></div><div class="sm" style="border-left-color:var(--inc)"><div class="l">Terminadas</div><div class="v">${tot.fin}</div></div><div class="sm" style="border-left-color:var(--warn)"><div class="l">Pruebas</div><div class="v">${tot.test}</div></div><div class="sm" style="border-left-color:var(--exp)"><div class="l">Fallidas · éxito</div><div class="v ${tot.fail?'dn':''}">${tot.fail} · ${tot.ok==null?'—':tot.ok+'%'}</div></div></div>
  <div class="sum" style="margin-bottom:12px"><div class="sm" style="border-left-color:var(--exp)"><div class="l">Coste (luz, desgaste, filamento)</div><div class="v">${money(tot.cost)}</div></div><div class="sm" style="border-left-color:var(--warn)"><div class="l">Perdido en pruebas y fallos</div><div class="v ${tot.lost?'dn':''}">${money(tot.lost)}</div></div><div class="sm" style="border-left-color:var(--inc)"><div class="l">Valor de lo producido</div><div class="v">${money(tot.value)}</div></div><div class="sm"><div class="l">Ganancia estimada</div><div class="v ${tot.value-tot.cost<0?'dn':'up'}">${money(tot.value-tot.cost)}</div></div></div>
  <div class="scroll"><table class="stack"><thead><tr><th>Impresora</th><th class="n">Horas</th><th class="n">Hechas</th><th class="n">Pruebas</th><th class="n">Fallidas</th><th class="n">Coste</th><th class="n">Producido</th></tr></thead><tbody>${all.map(f=>{const x=farmStats(f.id,from||0);return `<tr class="ck" data-fmr="${esc(f.id)}"><td><b>${esc(f.name)}</b><div class="note">${esc(farmCode(f))}${x.ok!=null?' · '+x.ok+'% éxito':''}</div></td><td class="n">${num(x.hours,1)}</td><td class="n">${x.fin}</td><td class="n">${x.test}</td><td class="n">${x.fail}</td><td class="n">${money(x.cost)}</td><td class="n">${money(x.value)}</td></tr>`}).join('')}</tbody></table></div>
  <p class="note" style="margin:8px 0 0">El coste sale del perfil de cada impresora (consumo, desgaste y velocidad) y del precio medio de tus bobinas; lo producido, de las impresiones de piezas registradas con esa impresora. ${IN_ARTIFACT?'Cuenta las impresiones que marcas a mano («Guardar trabajo» y «Terminado»).':'Las Bambu Lab en modo LAN se apuntan solas; las demás, con «Guardar trabajo» y «Terminado».'} Periodo: ${esc(rl)}.</p></div>
  <div class="card"><div class="ch"><h2>Actividad</h2>${farmNotifBtn()}</div><div style="display:grid;max-height:560px;overflow:auto">${flog().slice(0,25).map(e=>fevRow(e,true)).join('')||'<div class="empty">Aún no hay actividad. Aquí verás cuándo se enciende cada impresora y cuándo empieza, termina o falla cada impresión.</div>'}</div></div></div>`})():''}`}
function farmDetail(id){const f=S.farm.find(x=>x.id===id);if(!f)return;S.fmOpen=id;
 const ps=catalog().slice().sort((a,b)=>a.name.localeCompare(b.name));

  ${f.notes?`<div class="note">${esc(f.notes)}</div>`:''}

  <div class="acts"><button class="btn gh" data-efm="${esc(id)}" style="margin-right:auto">Editar</button><button class="btn gh" data-close>Cerrar</button></div>`,true);
 paintFarmModal();
 $('#ffj').onsubmit=async e=>{e.preventDefault();const job=e.target.job.value.trim();if(job&&job!==f.job)farmLog(id,'start',{file:job});await patch('farm',id,{job,status:job?'imprimiendo':(f.status==='imprimiendo'?'libre':f.status||'libre'),since:job?(f.job===job&&f.since?f.since:Date.now()):0});toast('Guardado');farmDetail(id)};
 const endAs=async(ev,test)=>{await farmLog(id,ev,{file:f.job,test:!!test,mins:f.since?Math.round((Date.now()-f.since)/60000):null});await patch('farm',id,{job:'',status:'libre',since:0,last:f.job,lastAt:Date.now()});toast(test?'Prueba apuntada':'Fallo apuntado');farmDetail(id)};
 {const ft=$('#fmtest');if(ft)ft.onclick=()=>endAs('finish',true);const ff=$('#fmfail');if(ff)ff.onclick=()=>endAs('fail')}
 const dn=$('#fmdone');if(dn)dn.onclick=async()=>{const p=catalog().find(x=>x.name===f.job);farmLog(id,'finish',{file:f.job,mins:f.since?Math.round((Date.now()-f.since)/60000):null});await patch('farm',id,{job:'',status:'libre',since:0,last:f.job,lastAt:Date.now()});
  if(p){closeModal();registerPrint(p.id)}else{toast('Impresora libre');farmDetail(id)}};

function paintAmsBox(f){const b=$('#fmams');if(!b)return;const l=(S.farmLive[f.id]||{}).live,live=l&&l.online&&Array.isArray(l.ams)?l.ams:[];const n=Math.max((f.ams||[]).length,live.length);if(!n){b.innerHTML='';return}

 l.percent=l.percent==null?null:Math.max(0,Math.min(100,l.percent));const s=LIVEST[l.state]||[l.state,'var(--pri)'],run=l.state==='RUNNING'||l.state==='PREPARE',pau=l.state==='PAUSE';
 box.innerHTML=`<div class="card" style="padding:14px;display:grid;gap:10px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="color:${s[1]}">● ${esc(s[0])}</b><span class="note">${l.wifi?'Wi-Fi '+esc(l.wifi):''}</span></div>

 const sp=$('#fmspd');if(sp)sp.onchange=()=>farmCmd(f.id,'speed',+sp.value);void adm}
async function farmCmd(id,cmd,value){

/* Coste por hora de una impresora de la granja: luz + desgaste + filamento estimado (perfil de la impresora) */
function farmHourCost(f){const p=(f&&fleet().find(x=>x.id===f.fleetId))||{...PDEF,w:150,gh:20};const kwh=+S.cfg.kwh||0.18;
 const sp=S.spools.filter(x=>+x.priceKg>0),pk=sp.length?sp.reduce((t,x)=>t+(+x.priceKg),0)/sp.length:20;
 return (+p.w||150)/1000*kwh+((+p.buy||0)/(+p.life||5000))+(+p.maint||0)+(+p.gh||20)/1000*pk}
function farmStats(pid,from){const l=S.farmlog.filter(e=>(!pid||e.pid===pid)&&e.date>=from);const fin=l.filter(e=>e.ev==='finish'&&!e.test),test=l.filter(e=>e.ev==='finish'&&e.test),fail=l.filter(e=>e.ev==='fail');
 const done=[...fin,...test,...fail],mins=done.reduce((t,e)=>t+(+e.mins||0),0);
 const cost=done.reduce((t,e)=>t+(+e.mins||0)/60*farmHourCost(S.farm.find(x=>x.id===e.pid)),0),lost=[...test,...fail].reduce((t,e)=>t+(+e.mins||0)/60*farmHourCost(S.farm.find(x=>x.id===e.pid)),0);
 const fl=pid?[S.farm.find(x=>x.id===pid)].filter(Boolean):S.farm,aliases=new Set(fl.map(f=>(fleet().find(x=>x.id===f.fleetId)||{}).alias).filter(Boolean));
 const value=S.prints.filter(x=>x.date>=from&&aliases.has(x.printer)).reduce((t,x)=>{const pr=S.products.find(p=>p.id===x.pid);return t+(+x.qty||0)*(pr?+pr.price||0:0)},0);
 return {fin:fin.length,test:test.length,fail:fail.length,hours:mins/60,cost,lost,value,ok:fin.length+fail.length?Math.round(fin.length/(fin.length+fail.length)*100):null}}

/* ---- Imprimir el ticket: directo en una impresora de la Raspberry (CUPS) o con la ventana de imprimir ----
   El ticket se dibuja a 300 ppp con el ancho exacto del papel elegido (rollo continuo de 62 mm de la Brother QL-700,
   otros anchos, etiqueta de largo fijo o A4) y se manda como PDF. Si la impresora no está, se abre la ventana normal. */
const TKP_W=[29,38,50,54,58,62,80,102];
const TKP_DEF={mode:'',queue:'',host:'',kind:'roll',w:62,h:0,ask:true};
function tkpGet(){try{const o=JSON.parse(localStorage.getItem('t3d-tkprint')||'null');if(o&&typeof o==='object')return {...TKP_DEF,...o}}catch(e){}return {...TKP_DEF}}
function tkpSet(o){try{localStorage.setItem('t3d-tkprint',JSON.stringify(o))}catch(e){}}
const tkpPaperName=o=>o.kind==='a4'?'A4 (folio)':o.kind==='label'?`Etiqueta ${o.w} × ${o.h} mm`:`Rollo continuo de ${o.w} mm`;
// Papel que pide el driver de CUPS
const tkpMedia=(o,len)=>o.kind==='a4'?'A4':o.kind==='label'?`${o.w}x${o.h}mm`:`Custom.${o.w}x${Math.ceil(len)}mm`;
function tkpLoadImg(src){return new Promise(ok=>{if(!src)return ok(null);const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ok(null);i.src=src})}
/* Dibuja el ticket como una tira de ancho cw (mm). Devuelve {cv, cuts} (cuts: alturas en px donde se puede cortar la página). */
async function tkpStrip(s,cw,dpi,fsMm){
 const k=dpi/25.4,W=Math.round(cw*k),fs=(fsMm||Math.max(2.1,Math.min(3.5,cw*0.052)))*k,lh=fs*1.32,F='Arial,Helvetica,sans-serif',t=x=>T(x);
 const logo=okImg(S.cfg.logo)?await tkpLoadImg(S.cfg.logo):null;
 let bc=null;try{if(typeof JsBarcode==='function'){bc=document.createElement('canvas');JsBarcode(bc,'T'+String(s.num).padStart(4,'0'),{format:'CODE128',displayValue:true,height:Math.round(fs*3.2),width:Math.max(2,Math.round(k*0.33)),margin:0,fontSize:Math.round(fs*0.95),font:'monospace',background:'#ffffff',lineColor:'#000000'})}}catch(e){bc=null}
 const run=(cx)=>{let y=0;const cuts=[];const font=(b,m=1)=>{cx.font=`${b?'700':'400'} ${Math.round(fs*m)}px ${F}`};
  const wrap=(txt,maxw)=>{const out=[];String(txt).split('\n').forEach(par=>{let cur='';par.split(/\s+/).forEach(w=>{const n=cur?cur+' '+w:w;if(cx.measureText(n).width<=maxw||!cur)cur=n;else{out.push(cur);cur=w}});
   while(cur&&cx.measureText(cur).width>maxw&&cur.length>1){let i=cur.length;while(i>1&&cx.measureText(cur.slice(0,i)).width>maxw)i--;out.push(cur.slice(0,i));cur=cur.slice(i)}out.push(cur)});return out};
  const center=(txt,b,m=1)=>{font(b,m);wrap(txt,W).forEach(l=>{cx.textAlign='center';cx.fillText(l,W/2,y+fs*m);y+=lh*m;cuts.push(y)})};
  const row=(a,b2,bold,m=1)=>{font(bold,m);const bw=cx.measureText(b2).width,ls=wrap(a,Math.max(W*0.35,W-bw-fs));ls.forEach((l,i)=>{cx.textAlign='left';cx.fillText(l,0,y+fs*m);if(i===0){cx.textAlign='right';cx.fillText(b2,W,y+fs*m)}y+=lh*m});cuts.push(y)};
  const hr=()=>{y+=lh*0.3;cx.save();cx.strokeStyle='#000';cx.lineWidth=Math.max(2,k*0.25);cx.setLineDash([k*1.2,k*0.8]);cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();cx.restore();y+=lh*0.7;cuts.push(y)};
  cx.fillStyle='#000';
  if(logo){const mh=14*k,mw=W*0.6,r=Math.min(mh/logo.height,mw/logo.width,1e9);const w=logo.width*r,h=logo.height*r;cx.drawImage(logo,(W-w)/2,y,w,h);y+=h+lh*0.4;cuts.push(y)}
  center(S.cfg.name||'',true,1.3);compLines().forEach(l=>center(l));
  center(t(+S.cfg.vat?'Factura simplificada':'Ticket de venta')+' '+tnum(s.num));center(fdt(s.date));hr();
  (s.items||[]).forEach(i=>row(i.name+(i.qty>1?' ×'+i.qty:''),(i.qty*i.price).toFixed(2)));hr();
  const v=+S.cfg.vat||0,tot=+s.total||0;if(v){const base=S.cfg.vatIncl===false?tot:tot/(1+v/100),iva=S.cfg.vatIncl===false?tot*v/100:tot-base;row(t('Base imponible'),base.toFixed(2));row(t('IVA {}%'+(S.cfg.vatIncl===false?'':' (incluido)')).replace('{}',num(v,2)),iva.toFixed(2))}
  row('TOTAL',money(s.total),true,1.3);
  row(t('Pago'),s.status==='pendiente'?t('PENDIENTE DE PAGO'):t(s.method||''));
  if(s.paidAt&&s.paidAt-s.date>36e5)row(t('Cobrado el'),fdt(s.paidAt));
  if(s.method==='Efectivo'&&s.cash){row(t('Entregado'),(+s.cash).toFixed(2));row(t('Cambio'),(+s.change||0).toFixed(2))}
  if(s.customerName)row(t('Cliente'),s.customerName);row(t('Atendido por'),s.sellerName||S.cfg.owner||'');
  if(s.status==='anulado'){hr();center('*** '+t('ANULADO')+' ***',true,1.2)}
  hr();if(S.cfg.footer)center(T(S.cfg.footer));
  if(bc){y+=lh*0.4;const r=Math.min(1,W/bc.width),w=bc.width*r,h=bc.height*r;cx.drawImage(bc,(W-w)/2,y,w,h);y+=h}
  y+=lh*0.3;cuts.push(y);return {y,cuts}};
 const m=document.createElement('canvas').getContext('2d');const {y}=run(m);
 const cv=document.createElement('canvas');cv.width=W;cv.height=Math.ceil(y);const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
 const r=run(cx);return {cv,cuts:r.cuts,k}}
/* Páginas completas (con márgenes) del tamaño del papel. Cada página: {cv, w, h} en mm. */
async function tkpPages(s,o){
 const a4=o.kind==='a4',dpi=a4?200:300,side=a4?60:Math.max(1.5,Math.min(3,o.w*0.03)),top=a4?15:2,bot=a4?15:3;
 const cw=a4?120:o.w-side*2,{cv,cuts,k}=await tkpStrip(s,cw,dpi,a4?4.2:0),L=cv.height/k;
 const pw=a4?210:o.w,ph=a4?297:o.kind==='label'?o.h:Math.max(20,L+top+bot);
 const room=(ph-top-bot)*k,pages=[];let from=0;
 while(from<cv.height-1){let to=cv.height;if(to-from>room){to=cuts.filter(c=>c>from&&c-from<=room).pop()||from+room}
  const pg=document.createElement('canvas');pg.width=Math.round(pw*k);pg.height=Math.round(ph*k);const g=pg.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,pg.width,pg.height);
  g.drawImage(cv,0,from,cv.width,to-from,Math.round((pw-cw)/2*k),Math.round(top*k),cv.width,to-from);pages.push({cv:pg,w:pw,h:ph});from=to;if(pages.length>30)break}
 return {pages,len:ph}}
/* PDF mínimo: una imagen JPEG por página, a página completa */
function tkpPDF(pages){
 const enc=new TextEncoder(),parts=[],offs=[];let size=0;const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);size+=b.length};
 const obj=(n,body)=>{offs[n]=size;add(n+' 0 obj\n');body();add('\nendobj\n')};
 add('%PDF-1.4\n%\xE2\xE3\n');const n=pages.length,pt=mm=>(mm*72/25.4).toFixed(2);
 obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));
 obj(2,()=>add(`<< /Type /Pages /Count ${n} /Kids [${pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')}] >>`));
 pages.forEach((p,i)=>{const b=3+i*3,W=pt(p.w),H=pt(p.h);
  const jpg=Uint8Array.from(atob(p.cv.toDataURL('image/jpeg',0.92).split(',')[1]),c=>c.charCodeAt(0));
  const cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  obj(b,()=>add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${b+2} 0 R >> >> /Contents ${b+1} 0 R >>`));
  obj(b+1,()=>{add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`)});
  obj(b+2,()=>{add(`<< /Type /XObject /Subtype /Image /Width ${p.cv.width} /Height ${p.cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);add(jpg);add('\nendstream')})});
 const total=3+n*3,xref=size;add(`xref\n0 ${total}\n0000000000 65535 f \n`+offs.slice(1,total).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
 const out=new Uint8Array(size);let p=0;parts.forEach(b=>{out.set(b,p);p+=b.length});return out}
function tkpB64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function tkpHTML(pages,title){const p=pages[0];return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:${p.w}mm ${p.h}mm;margin:0}html,body{margin:0;padding:0;background:#fff}img{display:block;width:${p.w}mm;height:${p.h}mm;break-after:page;page-break-after:always}img:last-child{break-after:auto;page-break-after:auto}</style></head><body>${pages.map(x=>`<img src="${x.cv.toDataURL('image/png')}" alt="">`).join('')}</body></html>`}
/* Imprime: directo si hay impresora de la Raspberry elegida; si no está o falla, con la ventana de imprimir */
async function tkPrint(id,o){const s=S.sales.find(x=>x.id===id);if(!s)return;
 if(!o){o=tkpGet();if(!o.mode||o.ask){tkPrintModal(id);return}}
 const title=T('Ticket')+' '+tnum(s.num);let r;
 try{r=await tkpPages(s,o)}catch(e){toast('No se pudo preparar el ticket');return}
 const dialog=()=>printDoc(tkpHTML(r.pages,title),title,'ticket-'+String(s.num).padStart(4,'0'),r.pages[0].w,r.pages[0].h);
 if(o.mode!=='cups'||IN_ARTIFACT)return dialog();
 toast(T('Imprimiendo en «{}»…').replace('{}',o.queue));
 try{const x=await api('POST','api/print/pdf',{queue:o.queue,host:o.host,media:tkpMedia(o,r.len),kind:o.kind,title,pdf:tkpB64(tkpPDF(r.pages))});
  if(x&&x.ok){toast(T(x.done?'Ticket impreso en «{}»':'Ticket enviado a «{}»').replace('{}',o.queue));return}
  toast(T(x&&x.error||'No se pudo imprimir')+' · '+T('Se abre la ventana de imprimir'))}
 catch(e){toast(T(e.message||'No se pudo imprimir')+' · '+T('Se abre la ventana de imprimir'))}
 setTimeout(dialog,900)}
/* Elegir impresora y papel (se recuerda en este aparato) */
function tkPrintModal(id){const s=S.sales.find(x=>x.id===id);if(!s)return;let o=tkpGet();if(!o.mode)o.mode=IN_ARTIFACT?'dialog':'cups';let list=null,why='';
 modal(`<div class="ch" style="margin:0"><h2>Imprimir ticket ${tnum(s.num)}</h2><button class="btn gh" data-close>Cerrar</button></div>
 <div style="display:grid;gap:12px"><label>Impresora<select id="tkpq"><option value="">Buscando impresoras…</option></select></label><div class="note" id="tkpinfo"></div>
 <div style="display:grid;gap:8px"><b style="font-size:14px">Papel</b><div class="tabs" id="tkpk"><button type="button" data-tkk="roll">Rollo continuo</button><button type="button" data-tkk="label">Etiqueta de largo fijo</button><button type="button" data-tkk="a4">A4 (folio)</button></div>
 <div class="f2" id="tkpsz"><label>Ancho del rollo<select id="tkpw">${TKP_W.map(w=>`<option value="${w}">${w} mm</option>`).join('')}</select></label><label id="tkphl">Largo de la etiqueta (mm)<input id="tkph" type="number" min="15" max="1000" step="1"></label></div></div>
 <div style="display:grid;justify-items:center;gap:6px;max-height:46vh;overflow:auto;background:var(--soft);border-radius:12px;padding:12px" id="tkpprev"></div>
 <label style="display:flex;gap:10px;align-items:center;font-weight:500"><input type="checkbox" id="tkpask" style="width:18px;height:18px;min-height:0">Recordar y la próxima vez imprimir directamente al pulsar «Imprimir»</label>
 <p class="note" style="margin:0">El ticket se adapta al papel: en un rollo continuo sale tan largo como haga falta; en etiquetas de largo fijo se reparte en varias; en A4 sale en un folio. Para cambiarlo más tarde, pulsa ⚙ al lado de «Imprimir».</p></div>
 <div class="acts"><button class="btn gh" data-close>Cancelar</button><button class="btn" id="tkpgo">${ico('rcpt')}Imprimir</button></div>`,true);
 const paint=async()=>{$('#tkpk').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tkk===o.kind));$('#tkpsz').style.display=o.kind==='a4'?'none':'';$('#tkphl').style.display=o.kind==='label'?'':'none';
  $('#tkpw').value=String(o.w);$('#tkph').value=o.h||'';
  try{const {pages}=await tkpPages(s,o);const box=$('#tkpprev');if(!box)return;const px=o.kind==='a4'?260:Math.min(300,o.w*4.2);
   box.innerHTML=pages.map(p=>`<img src="${p.cv.toDataURL('image/png')}" alt="" style="width:${px}px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);border-radius:3px">`).join('')+`<div class="note">${esc(T(tkpPaperName(o)))}${pages.length>1?' · '+pages.length+' '+T('páginas'):''}</div>`}catch(e){}};
 const info=()=>{const el=$('#tkpinfo');if(!el)return;const p=list&&list.printers.find(x=>x.name===o.queue);
  el.innerHTML=o.mode==='dialog'?esc(T('Se abre la ventana de imprimir del ordenador o del móvil: ahí eliges cualquier impresora (también las de casa u oficina).'))
   :p?esc([p.make||p.info,p.state==='stopped'?T('Parada'):p.offline?T('No responde'):T('Preparada'),p.paper&&p.paper.a4?T('Papel: {}').replace('{}',/letter/i.test(p.media)?'Letter':'A4'):p.label?T('Impresora de etiquetas o tickets'):''].filter(Boolean).join(' · ')):esc(why)};
 const fill=()=>{const q=$('#tkpq');if(!q)return;const ps=list?list.printers:[];
  q.innerHTML=ps.map(p=>`<option value="c:${esc(p.name)}">🖨 ${esc(p.info||p.name)}${p.label?' · '+esc(T('etiquetas / tickets')):''} (${esc(T('en la Raspberry'))})</option>`).join('')+`<option value="d:">${esc(T('Ventana de imprimir (elegir otra impresora)'))}</option>`;
  if(o.mode==='cups'&&!ps.some(p=>p.name===o.queue)){const def=ps.find(p=>p.label)||ps[0];if(def)pick(def);else o.mode='dialog'}
  q.value=o.mode==='cups'?'c:'+o.queue:'d:';info()};
 const near=w=>TKP_W.reduce((a,b)=>Math.abs(b-w)<Math.abs(a-w)?b:a);
 const pick=p=>{o.mode='cups';o.queue=p.name;const pp=p.paper;  // se adapta al papel de esa impresora
  if(p.label){o.kind='roll';o.w=pp&&pp.w&&pp.w<=120?near(pp.w):62}  // impresora de etiquetas o tickets: rollo continuo de su ancho
  else o.kind='a4'};  // impresora normal: folio
 $('#tkpq').onchange=e=>{const v=e.target.value;if(v.startsWith('c:')){const p=list.printers.find(x=>x.name===v.slice(2));if(p)pick(p)}else o.mode='dialog';info();paint()};
 $('#tkpk').onclick=e=>{const b=e.target.closest('[data-tkk]');if(!b)return;o.kind=b.dataset.tkk;if(o.kind==='label'&&!o.h)o.h=o.w===62?100:90;paint()};
 $('#tkpw').onchange=e=>{o.w=+e.target.value;paint()};$('#tkph').onchange=e=>{o.h=Math.max(15,Math.min(1000,+e.target.value||0));paint()};
 $('#tkpgo').onclick=()=>{if(o.kind==='label'&&!(o.h>=15)){toast('Pon el largo de la etiqueta');return}o.ask=!$('#tkpask').checked;tkpSet(o);closeModal();tkPrint(id,o)};
 $('#tkpask').checked=!tkpGet().mode||!o.ask;paint();
 if(IN_ARTIFACT){list={printers:[]};why='';fill();return}
 api('GET','api/print/printers'+(o.host?'?host='+encodeURIComponent(o.host):'')).then(r=>{list=r&&r.printers?r:{printers:[]};why=r&&r.error?T(r.error):'';if(!list.printers.length&&!why)why=T('La Raspberry no tiene impresoras instaladas.');fill();paint()})
  .catch(e=>{list={printers:[]};why=T(e.message||'No se pudo pedir la lista');fill()})}
/* ---- Nube de Bambu (solo ver) ---- */

 api('GET','api/bambu/devices').then(r=>{const box=$('#bcdev');if(!box)return;const ds=r.devices||[];
  box.innerHTML=ds.length?ds.map(d=>{const f=S.farm.find(x=>String(x.serial||'').toUpperCase()===d.serial.toUpperCase());const others=S.farm.filter(x=>!x.serial);

   const total=items.reduce((t,i)=>t+i.qty*i.price,0);W.push(['sales',{num:++num,date:now-d*864e5-rnd(0,8)*3600e3,items,total,units:items.reduce((t,i)=>t+i.qty,0),method:pick(['Efectivo','Tarjeta','Bizum']),cash:0,change:0,customerId:'',customerName:pick(['','Laura','Marcos','Ana','Tienda Ruiz']),sellerId:'',sellerName:'',status:'pagado'}])}

function demoNewJob(s){const pr=pick(DEMO_PRODS),qty=Math.ceil(rnd(1,5));s.file=pr[0].toLowerCase().replace(/\s+/g,'_')+(qty>1?'_x'+qty:'')+'.3mf';s.total=Math.max(20,Math.round(pr[4]*60*qty));s.pct=0;s.layers=Math.round(rnd(80,600));s.state='PREPARE';s.prep=4;s.prod=pr[0];s.qty=qty}
function demoInit(){
 if(demoTimer||!S.farm.length||demoSeeding)return;
 const states=['RUNNING','RUNNING','RUNNING','RUNNING','PAUSE','RUNNING','IDLE','OFF','FINISH','RUNNING'];
 S.farm.slice().sort((a,b)=>(a.n||0)-(b.n||0)).forEach((f,i)=>{const fl=fleet().find(x=>x.id===f.fleetId)||{};const big=/H2D|X1/.test(f.model||'');
  const s=demoSim[f.id]={online:states[i]!=='OFF',error:states[i]==='OFF'?'No se encuentra la impresora en la red':'',state:states[i]==='OFF'?'':states[i],speed:2,light:true,nozzleDia:+fl.nozzle||0.4,nozzleType:{hs:'hardened_steel',ss:'stainless_steel',hf:'hardened_steel_high_flow'}[fl.ntype]||'stainless_steel',
   trays:Array.from({length:/A1/.test(f.model||'')?4:big?8:4},(_,k)=>{const t=DEMO_TRAYS[(i+k)%DEMO_TRAYS.length];return {type:t[0],color:t[1],remain:Math.round(rnd(10,100))}}).slice(0,4),
   nozzle:25,bed:25,chamber:big?28:0,wifi:'-'+Math.round(rnd(38,70))+'dBm',errors:0,idle:0};
  demoNewJob(s);if(states[i]==='RUNNING'||states[i]==='PAUSE'){s.state=states[i];s.pct=Math.round(rnd(8,85));s.nozzle=220;s.bed=55}
  if(states[i]==='FINISH'){s.state='FINISH';s.pct=100;s.idle=5}if(states[i]==='OFF'){s.state=''}if(states[i]==='IDLE'){s.state='IDLE';s.file=''}});
 demoTimer=setInterval(demoTick,1000);demoTick()}
function demoSummary(s){const run=s.state==='RUNNING'||s.state==='PAUSE'||s.state==='PREPARE';
 return {online:s.online,error:s.error,state:s.online?s.state:'',percent:run||s.state==='FINISH'?Math.floor(s.pct):null,remaining:run?Math.max(0,Math.round(s.total*(100-s.pct)/100/[0,1.6,1,0.8,0.6][s.speed])):null,layer:run?Math.max(1,Math.round(s.layers*s.pct/100)):null,layers:run?s.layers:null,file:s.file,
  nozzle:Math.round(s.nozzle),nozzleT:run&&s.state!=='PAUSE'?220:0,bed:Math.round(s.bed),bedT:run?55:0,chamber:s.chamber?Math.round(s.chamber):null,speed:s.speed,light:s.light,trays:s.trays,wifi:s.wifi,errors:s.errors,printError:0,nozzleDia:s.nozzleDia,nozzleType:s.nozzleType,ams:[{id:0,humidity:s.hum||(s.hum=Math.round(rnd(18,45))),level:null,temp:s.chamber?Math.round(s.chamber):24,trays:s.trays}],updated:Date.now()}}
async function demoTick(){
 for(const f of S.farm){const s=demoSim[f.id];if(!s)continue;
  const heat=(cur,tg)=>cur+(tg-cur)*0.25+rnd(-.4,.4);
  if(s.online){
   if(s.state==='PREPARE'){s.nozzle=heat(s.nozzle,220);s.bed=heat(s.bed,55);if(--s.prep<=0){s.state='RUNNING'}}
   else if(s.state==='RUNNING'){s.nozzle=heat(s.nozzle,220);s.bed=heat(s.bed,55);if(s.chamber)s.chamber=heat(s.chamber,34);
    s.pct=Math.min(100,s.pct+100/s.total*[0,0.6,1,1.25,1.65][s.speed]*1);s.trays.forEach(t=>{if(Math.random()<0.02&&t.remain>3)t.remain--});
    if(Math.random()<0.0008){s.state='FAILED';s.errors=1;farmLog(f.id,'fail',{file:s.file,mins:Math.round(s.total*s.pct/100),percent:Math.floor(s.pct)})}
    else if(s.pct>=100){s.state='FINISH';s.idle=0;await farmLog(f.id,'finish',{file:s.file,mins:s.total});
     const p=S.products.find(x=>x.name===s.prod);if(p){put('prints','',{pid:p.id,name:p.name,qty:s.qty,printer:(fleet().find(x=>x.id===f.fleetId)||{}).alias||'',grams:(+p.grams||0)*s.qty,hours:(+p.hours||0)*s.qty,date:Date.now(),spool:''}).catch(()=>{});patch('products',p.id,{stock:(+p.stock||0)+s.qty}).catch(()=>{})}}}
   else{s.nozzle=heat(s.nozzle,26);s.bed=heat(s.bed,26);if(s.chamber)s.chamber=heat(s.chamber,27);
    if((s.state==='FINISH'||s.state==='FAILED'||s.state==='IDLE')&&++s.idle>(s.state==='IDLE'?40:25)){s.idle=0;s.errors=0;demoNewJob(s);farmLog(f.id,'start',{file:s.file})}}}
  S.farmLive[f.id]={hasAccess:true,live:demoSummary(s)}}
 if((S.view==='granja'||S.view==='taller')&&!$('#ov').classList.contains('show'))render();paintFarmModal()}
function demoCmd(id,cmd,value){const s=demoSim[id];if(!s||!s.online){toast('La impresora no está conectada');return}
 const f=S.farm.find(x=>x.id===id);
 if(cmd==='pause'&&s.state==='RUNNING'){s.state='PAUSE';farmLog(id,'pause',{file:s.file,percent:Math.floor(s.pct)})}
 else if(cmd==='resume'&&s.state==='PAUSE'){s.state='RUNNING';farmLog(id,'resume',{file:s.file})}

function printerArt(k,c='#5750f1'){
 if(k==='resin')return `<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="40" width="32" height="16" rx="3" fill="#2b2f45"/><rect x="18" y="12" width="28" height="30" rx="3" fill="#f59e0b" opacity=".75"/><rect x="22" y="44" width="10" height="6" rx="1" fill="${c}"/></svg>`;

 const big=k==='big',w=big?52:44,x=(64-w)/2;
 return `<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="${x}" y="${big?6:10}" width="${w}" height="${big?52:46}" rx="5" fill="#2b2f45"/><rect x="${x+4}" y="${big?11:15}" width="${w-8}" height="${big?36:30}" rx="2" fill="${k==='open'?'#1b2238':'#9db4ff'}" opacity="${k==='open'?1:.35}"/><rect x="${x+w/2-6}" y="${big?16:20}" width="12" height="7" rx="2" fill="${c}"/><rect x="${x+8}" y="${big?41:39}" width="${w-16}" height="3" rx="1" fill="#9aa3bb"/><circle cx="${x+w-7}" cy="${big?53:51}" r="2" fill="#34d399"/></svg>`}
const PDEF={nozzle:0.4,ntype:'',layer:0.2,infill:15,walls:2,buy:'',life:5000,maint:0.05};
/* ---- boquillas (nozzles) ----
   Bambu Lab vende: 0,2 inoxidable; 0,4 inoxidable o endurecido; 0,6 y 0,8 endurecido; 0,4 alto flujo (endurecido).
   A1, A1 mini, P1P y P1S traen 0,4 inoxidable; X1C, X1E, P2S, X2D, H2D y H2S traen 0,4 endurecido.
   Perfiles de Bambu Studio: capa 0,10 / 0,20 / 0,30 / 0,40 según boquilla 0,2 / 0,4 / 0,6 / 0,8. */
const NTYPES={ss:'Acero inoxidable',hs:'Acero endurecido',hf:'Alto flujo (endurecido)',br:'Latón'};
const NSHORT={ss:'inox',hs:'endurecido',hf:'alto flujo',br:'latón'};
const NLAYER={0.2:0.1,0.4:0.2,0.6:0.3,0.8:0.4},NSPEED={0.2:0.35,0.4:1,0.6:1.8,0.8:2.8};
const isBambu=f=>/bambu/i.test((f&&f.brand)||'');
const nozzleCombos=f=>isBambu(f)?[[0.2,'ss'],[0.4,'ss'],[0.4,'hs'],[0.4,'hf'],[0.6,'hs'],[0.8,'hs']]:[0.2,0.4,0.6,0.8].flatMap(d=>[[d,'br'],[d,'ss'],[d,'hs']]);
const nozzleDefault=f=>isBambu(f)?(/^(A1|A1 mini|A2L|P1P|P1S)$/i.test(f.model||'')?'ss':'hs'):'br';
const nozzleTxt=f=>num(+f.nozzle||0.4,1)+' mm'+(f.ntype?' '+NSHORT[f.ntype]:'');
// según la tabla de compatibilidad de Bambu Lab: fibra (CF/GF) y glow piden acero endurecido; purpurina, mármol, madera… solo evitan la 0,2
const ABRASIVE=/(\b|-)(cf|gf|carbon|carbono|fibra|glass|vidrio|glow|fosfo\w*|paht)\b/i;
const PARTICLES=/\b(marble|m[aá]rmol|sparkle|galaxy|purpurina|metal|wood|madera|stone|piedra|rock)\b/i;
function nozzleWarn(pr,txt){if(!pr||!txt)return '';const d=+pr.nozzle||0.4,t=pr.ntype||'';
 if((ABRASIVE.test(txt)||PARTICLES.test(txt))&&d<=0.2)return 'Este filamento lleva partículas (fibra, purpurina, mármol…) y atasca una boquilla de 0,2. Usa 0,4 o mayor.';
 if(ABRASIVE.test(txt)&&(t==='ss'||t==='br'))return 'Este filamento es abrasivo: necesita boquilla de acero endurecido. Con '+NTYPES[t].toLowerCase()+' la boquilla se desgasta.';
 if(/\btpu\b/i.test(txt)&&d<=0.2)return 'El TPU no se recomienda con boquilla de 0,2.';
 return ''}

function editPrinter(id,fresh){const f=fresh?{...PDEF,...fresh}:fleet().find(x=>x.id===id);if(!f)return;
 modal(`<div style="display:flex;gap:14px;align-items:center"><div id="phbox" style="width:72px;height:72px;flex:none;border-radius:14px;overflow:hidden;background:var(--soft)">${prPic(f)}</div><div><h2>${fresh?'Añadir impresora':'Perfil de la impresora'}</h2><div class="note">${esc(f.brand)} ${esc(f.model)}${f.v?' · '+esc(f.v)+' mm':''}</div></div></div>

 {const fm0=$('#fpr'),combos=nozzleCombos(f),key=(d,t)=>d+'|'+t;let own=new Set(f.nozzles||[]);

const US_ON_ES={'Ñ':':','ñ':';',"'":'-','-':'/','_':'?','¡':'=','¿':'+','"':'@','&':'^','/':'&','(':'*',')':'(','=':')','`':'[','+':']','^':'{','*':'}','ç':'\\','Ç':'|','´':"'",'¨':'"','º':'`','ª':'~',';':'<',':':'>'};

 if(r.status===401){ME=null;showLogin();throw {code:'revoked',message:'Sesión caducada'}}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){const m=(j&&j.error)||t||('Error '+r.status);if(r.status===403)toast(m);throw {code:r.status===403?'invalid_argument':'unavailable',message:m}}
 return j}
