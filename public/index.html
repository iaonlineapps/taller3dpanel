 if(!/^[a-zA-Z0-9._-]{3,32}$/.test(username))throw {message:'El usuario debe tener de 3 a 32 letras, números, punto, guion o guion bajo'};
 if(password.length<4)throw {message:'La contraseña debe tener al menos 4 caracteres'};
 if(email&&!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email))throw {message:'El email no es válido'};
 if(S.appusers.some(u=>u.username.toLowerCase()===username.toLowerCase()))throw {message:'Ese usuario ya existe'};
 const salt=rhex(16),hash=await pbk(password,salt);
 const d={username,name:String(b.name||username).trim().slice(0,80),email,salt,hash,role:role||'editor',active:true,created:Date.now()};

const NEWS=[
 ['1.0.31',["**Al pasar el ratón por los botones de arriba te dice qué es cada uno:** la versión (pulsa para ver las novedades), recargar o buscar actualizaciones, el idioma, el modo oscuro o claro, la campanita y tu cuenta. En español y en inglés.","**La campanita es el aviso de «Por reponer».** El punto rojo sale cuando alguna pieza o producto activo está agotado o tiene el mínimo de stock o menos. Al pasar el ratón te dice cuántos hay, y al pulsarla los ves. Si alguno no lo vas a reponer, márcalo con «No la voy a reponer» o desactívalo y deja de contar."]],
 ['1.0.30',["**Ordenar todas las listas.** Clientes, piezas, productos, colaboradores, tickets, servicios, filamentos, gastos y movimientos tienen un selector **«Ordenar»**: de la A a la Z, de la Z a la A, por fecha (más recientes o más antiguas) y otros (más stock, precio, importe…). Se recuerda lo que eliges.","**Clientes en orden** de la A a la Z y con **buscador** propio.","**Una X para borrar la búsqueda** de un toque en todos los buscadores."]],
 ['1.0.29',["**Se ve qué es cada pieza.** En las fichas con foto sale arriba a la derecha su categoría (Llavero, Figura, Imán…), también en la lista y, más grande, al abrir la pieza o el producto."]],
 ['1.0.28',["**Códigos según la categoría.** Las piezas nuevas reciben solas un código de su categoría: **LLV-001** para Llaveros, **IMN-001** para Imanes, **FIG-001** para Figuras, **NAV-001** para Navidad, **PIL-001** para Pilas… Si dejas el código **vacío o pones 0**, se pone solo.","**Cambia el principio del código** de cada categoría en el botón **«Categorías»** (columna «Código»).","**Poner códigos a todo de una vez.** En **«Categorías»** pulsa **«Poner códigos…»**: ves la lista (código viejo → nuevo) y confirmas. El código viejo se guarda, así el lector y las ventas antiguas siguen encontrando la pieza."]],
 ['1.0.27',['**Gestiona tus categorías.** En **Piezas y stock** (y en **Productos de reventa**) hay un botón nuevo **«Categorías»**: crea categorías nuevas (por ejemplo «Figuras»), cámbiales el nombre, únelas (pon a una el mismo nombre que otra) o bórralas (sus piezas pasan a «Otros»). El cambio se aplica a todas sus piezas y a sus ventas, para que los informes cuadren.','Para cambiar la categoría de **una sola pieza** (por ejemplo la copa grande de 23 cm a «Figuras»), ábrela, pulsa **«Editar»** y elige la categoría.']],
 ['1.0.26',['**El bot de Telegram ya no se calla las piezas desactivadas que aún tienen stock.** Al final de **/stock** sale «Desactivadas que aún tienen stock», con sus unidades, para que veas todo lo que tienes de verdad. Para volver a usarlas: Piezas y stock → «Desactivadas» → «Activar».']],
 ['1.0.25',["**Aviso de versión nueva.** Si tienes la web instalada como app (acceso directo en el escritorio o en el móvil), ya no se queda en la versión vieja: cuando actualizas la Raspberry sale arriba **«Hay una versión nueva»** y con **«Actualizar»** se recarga con la nueva. Lo mira al abrirla, cada 5 minutos y al volver a la ventana.","**Botón para recargar:** arriba, junto a la versión, está el botón **↻** (y en **Ajustes**, **«Recargar o buscar actualizaciones»**). Recarga la página y te dice si ya tienes la última versión.","Arreglado: las traducciones al inglés de una versión nueva podían tardar hasta un día en verse."]],
 ['1.0.24',['**Varias marcas en un mismo producto de reventa.** En «Editar producto» marca **«Tengo varias marcas»** y pon cada marca con **su pack** (precio y unidades) y su stock: por ejemplo pilas AA de Duracell (pack de 20) y de Varta (pack de 40). Cada marca tiene **su coste por unidad** y lo que **ganas** con ella.','El stock del producto es la **suma de todas las marcas**. Al vender **eliges la marca**, se descuenta de esa marca y la ganancia se calcula con su coste. La marca sale en el ticket.','En la ficha del producto ves una tabla **«Por marca»** con el pack, el coste, lo que ganas, lo vendido y el stock de cada marca. En **«+ Compré otro pack»** eliges la marca (o escribes una nueva).']],
 ['1.0.23',['**Desactivar una pieza o un producto** que por ahora no vas a hacer más: pulsa **«Desactivar»** en su foto (o en la lista, en su ficha o con el botón derecho). Desaparece de Vender, de «Por reponer», de los avisos y del bot de Telegram, pero no se borra nada.','Para verlas, pulsa **«Desactivadas»** en Piezas y stock (o **«Desactivados»** en Productos de reventa). Con **«Activar»** vuelven a estar como antes.']],
 ['1.0.22',['**Nueva sección «Productos»** (en el menú, en «Servicios»): para lo que **compras hecho y vendes suelto**, como las **pilas**. Pones el **precio del pack** y **cuántas trae**, y el **coste por unidad sale solo** (pack ÷ unidades).','Cada producto tiene su **precio de venta**, lo que **ganas por unidad** (y el %), su **stock**, el **aviso de reponer** y la opción **«No lo voy a reponer»**. Con **«+ Compré otro pack»** sumas las unidades al stock y, si quieres, se apunta en Gastos.','Se venden desde **Vender** como cualquier pieza (también escaneando su código) y **se descuentan del stock**. En el **Panel** salen aparte como **«Productos de reventa»**, con sus ventas y sus compras, y el **/stock del bot de Telegram** también los incluye.','**Piezas en varios colores, cada color con su stock:** en «Editar pieza» marca **«La vendo en varios colores»** y pon cuántas tienes de cada color (por ejemplo llaveros: 5 rojos, 3 azules, 2 blancos).','Al vender esa pieza (en Vender, con el escáner o desde su ficha) **eliges el color** y se descuenta de ese color. El color sale en el ticket.','En la ficha de la pieza ves el **stock de cada color** y **«Vendidas por color»**: cuántas has vendido de cada uno y cuánto dinero. El bot de Telegram también te dice el stock por color con /stock.','**Ventas con su fecha.** Al vender, en el ticket hay un campo nuevo **«Fecha de la venta»** (por defecto, ahora). Pon una fecha pasada para **pasar ventas antiguas** de otra app: cuentan en el panel, los informes y las ganancias **en el día que pones**, no hoy.','Con fecha pasada eliges si **se restan las piezas del stock** o no. Sin marcar (lo normal al pasar ventas antiguas), tu stock no cambia y puedes añadir piezas aunque estén agotadas. La fecha se queda puesta para pasar varias seguidas; con «Hoy» vuelves a ahora.','Al **editar un ticket** también puedes cambiar su fecha.','**Imprimir el ticket con un botón.** En **Tickets**, abre un ticket y pulsa **«Imprimir»**. Con la impresora de etiquetas **Brother QL-700** enchufada a la Raspberry sale **directamente**, sin ventanas, en el rollo continuo de 62 mm y tan largo como el ticket.','**Se adapta al papel:** la primera vez eliges la impresora y el papel (rollo continuo de 29 a 102 mm, etiqueta de largo fijo o **A4 en un folio**). La app reconoce las impresoras que tiene la Raspberry y pone sola el papel que les va: rollo en las de etiquetas o tickets, A4 en las normales. Con la rueda ⚙ lo cambias cuando quieras.','Si la impresora no está (apagada o desenchufada), se abre la **ventana normal de imprimir** del ordenador o del móvil, donde puedes elegir cualquier impresora de casa u oficina.','**etiquetas.sh** ahora también añade solas a la Raspberry las impresoras normales de tu red (las que tienen AirPrint o IPP), para imprimir en A4 directamente.','**El bot de Telegram ya te dice todo tu stock:** escribe **/stock** y te contesta con **todas las piezas que te quedan** y cuántas unidades hay de cada una (con su color), y aparte las agotadas. Las que están por debajo del mínimo salen marcadas con ⚠️.','Para ver solo lo que hay que reponer, escribe **/poco**. /resumen también lo incluye.','El número rojo ya no está fijo en «Piezas y stock»: ahora hay una entrada aparte en el menú, **«Por reponer»**, que solo sale cuando hay algo que reponer.','**Piezas que no vas a reponer:** en «Editar pieza» marca **«No la voy a reponer»** y deja de contar en «Por reponer» y de avisarte (tampoco el bot).','En **Piezas y stock**, cuando ves solo lo que hay que reponer, sale arriba un aviso con el botón **«Ver todas»**, y al cambiar de sección vuelves a ver todas las piezas.']],
 ['1.0.21',['**Nueva sección «Administración»** en el menú (solo la ve el administrador): ahí están juntos los **usuarios**, la **granja de impresoras**, el **bot de Telegram** y las **copias de seguridad**. En «Ajustes» queda lo de tu empresa, tu cuenta, el idioma y los costes.','**Bot de Telegram del taller:** en **Administración → Bot de Telegram** pegas el token de tu bot (lo creas en 2 minutos con @BotFather) y te avisa en el móvil cuando una impresora **empieza, va por el 25, 50 y 75 %, se pausa, termina o falla**, cuando una pieza **se agota** y cuando **entra una venta**.','También le puedes **preguntar**: /estado (cómo están las impresoras), /stock, /ventas, /resumen y /ayuda. Solo te contesta a ti. Eliges qué avisos quieres y si te habla en español o en inglés.','La granja ya funciona con **otras marcas**, no solo Bambu Lab: impresoras con **Klipper (Moonraker)**, **OctoPrint** y **PrusaLink** (Prusa MK4, XL, MINI…). Al añadir la impresora, elige su tipo en «Conexión» y pon su IP: se ve en directo y puedes pausar, seguir o parar.','**Pesa la bobina y te digo lo que queda.** En la ficha de una bobina (Filamentos) hay un cuadro nuevo «Pesar la bobina en la báscula»: pones el peso de la bobina entera y la app le resta el carrete vacío de su marca (Bambu Lab, Prusament, Sunlu, eSun, Elegoo, Creality, Polymaker…). «Quedan» se actualiza solo.','Si tu marca no está, elige «Otra marca o no lo sé» o «Lo peso yo» y escribe el peso del carrete vacío.','Ahora ves también **los metros de filamento** que quedan en cada bobina (según el material y el diámetro): 1 kg de PLA de 1,75 mm son unos 335 m.']],
 ['1.0.20',['En **Novedades** hay un botón **«↑ Volver arriba»**: aparece al bajar por la lista y te sube arriba del todo de un toque.','Al abrir **Novedades** sale siempre **la versión más reciente arriba del todo**.']],
 ['1.0.19',['**Imprimir una etiqueta suelta** en una impresora de etiquetas (Brother QL-700 y parecidas, rollo de 62 mm). En la ficha de una pieza pulsa «Etiqueta», y en la de una impresora de la granja, «Imprimir etiqueta». También con «Imprimir esta» en la hoja de etiquetas.','Elige el tamaño (pequeña de 62 × 29 mm o grande de 62 × 100 mm), mira cómo queda y pulsa «Imprimir». La hoja A4 de siempre sigue igual.','**Instalar la impresora en la Raspberry:** en esa misma ventana, en «¿Primera vez?», está la línea para pegar por SSH. Instala todo, la comparte en casa y saca una etiqueta de prueba.']],
 ['1.0.18',['**Pie de página nuevo:** abajo del todo sale ahora «Proyecto sin ánimo de lucro, gratis y sin anuncios · App creada con ayuda de inteligencia artificial (IA) · © 2026 IA Online Apps · Uso personal no comercial».']],
 ['1.0.17',['**¿Has olvidado tu usuario o tu contraseña?** Ahora cada cuenta tiene un **código de recuperación**. Te lo enseñamos una vez al crear la cuenta (si tu cuenta ya existía, la próxima vez que entres). Puedes copiarlo, mandártelo por WhatsApp, Telegram o correo, o bajarlo como archivo.','Si olvidas el usuario o la contraseña, en la pantalla de entrada toca «¿Has olvidado tu usuario o contraseña?», pon el código y una contraseña nueva, y verás también tu usuario.','Si lo pierdes, en **Ajustes → Mi cuenta → Código de recuperación** puedes sacar uno nuevo. El administrador sigue pudiendo poner una contraseña nueva a cualquiera.']],
 ['1.0.16',['En el **Panel**, en «Colaboradores», cada colaborador enseña ahora **lo que ha ganado** con su margen en ese periodo, en vez de lo gastado. Debajo ves lo que ha vendido, lo que ha gastado y si te debe algo.']],
 ['1.0.15',['La lista de **materiales** ya tiene todos los tipos que venden Bambu Lab, eSUN, Elegoo, Smart Materials 3D y Winkle: PLA HD, PLA Mate, PLA Seda (Silk), PLA+, PLA reciclado, PLA-CF, PETG reciclado, PETG-CF, ABS-GF, ASA, TPU, Nylon, PVA… ordenados por grupos. Si falta alguno, elige «Otro (escribir)». Sale al crear o editar una pieza, en Filamentos y en la Calculadora.']],
 ['1.0.14',['Las **fotos de las piezas** ya se ven bien en la barra que se mueve arriba del Panel (antes salían cortadas).']],
 ['1.0.13',['**Ventas de un colaborador**: si la guardas como cobrada (efectivo, Bizum, tarjeta…), es que él ya ha cobrado al cliente. Se queda su parte, te da la tuya y no queda nada pendiente.',
  'Si la guardas **«A deber»** (un encargo sin pagar), en su ficha sale **«Te debe»** con tu parte. Cuando te pague, pulsa «Cobrar ahora» en el ticket. Con un colaborador ya no hace falta elegir cliente para dejarla a deber.']],
 ['1.0.12',['Si pusiste el **margen a un colaborador después de hacer sus ventas**, ahora en su ficha sale «Aplicar su margen a sus ventas anteriores» y se le suma su parte de esas ventas.',
  'Al **editar un ticket** y guardar, también se recalcula el margen del colaborador.']],
 ['1.0.11',['**Editar un ticket ya hecho**: en Tickets, abre el ticket y pulsa «Editar». Puedes poner el cliente si se te olvidó, cambiar quién lo vendió, la forma de pago, las cantidades y los precios, quitar piezas o añadir otras.',
  'El **stock se ajusta solo** con los cambios, y también el margen del colaborador y tus cuentas. En el ticket queda apuntado cuándo se corrigió y quién lo hizo.']],
 ['1.0.10',['**Margen de los colaboradores**: en cada colaborador pones lo que se lleva por cada pieza que vende (por ejemplo **1 € por pieza**, o un %). Al ponerle como «Vendido por» en una venta, ese dinero se le apunta a él y tu beneficio cuenta solo tu parte.',
  'Elige si el precio del ticket **ya incluye su margen** (la pieza a 5 €: 1 € para él y 4 € para ti) o **se le suma** (la pieza a 4 € y el ticket sale a 5 €).',
  'En «Colaboradores» ves lo que ha ganado cada uno, lo que tienes **pendiente de pagarle** y sus ventas. Cuando le pagues, pulsa «Marcar su margen como pagado».']],
 ['1.0.9',['La web y la app tienen **cada una su color de logo**: la **web en verde** («Taller3D Panel Web») y la **app de Android en índigo**, para distinguirlas.',
  'La **app de Android avisa sola cuando hay una versión nueva**: al abrirla sale «Hay una actualización» y con «Actualizar» se descarga y se instala encima. La APK viene con la web, así que siempre está la última.']],
 ['1.0.8',['Puedes **subir el archivo de la pieza** (STL, 3MF o STEP) desde el ordenador o el móvil, en «Nueva pieza» o «Editar». Se guarda con la pieza, lo descargas desde su ficha y te rellena solo los gramos y las horas (exactos si es un 3MF laminado en Bambu Studio).']],
 ['1.0.7',['Nuevo **logo de Taller3D Panel**: un cubo impreso capa a capa con la boquilla. Sale en el icono de la app de Android, en la pestaña del navegador y en la pantalla de entrar.']],
 ['1.0.6',['La app ya está en **dos idiomas: español e inglés**. Cámbialo con el botón **ES / EN** de arriba, en la pantalla de entrar o en Ajustes → Idioma.',
  'Las fechas, los números, los tickets que copias o mandas por WhatsApp y los CSV también salen en el idioma elegido.']],
 ['1.0.5',['**Duplicar una pieza**: con el botón derecho (o dejando el dedo pulsado en el móvil) sobre una pieza, o con el botón «Duplicar» de su ficha. Se abre con todo copiado (foto, categoría, colores, gramos, coste y precio) y el stock a 0: solo cambias lo que quieras, por ejemplo el nombre y el color.']],
 ['1.0.4',['El **stock se puede cambiar desde «Editar pieza»**: escribe el número que tienes y guarda. El cambio queda apuntado en Movimientos.']],
 ['1.0.3',['Junto al **nombre de cada pieza** salen unos **puntos con su color** (o sus colores, si es a dos colores). Así distingues de un vistazo la bola de Navidad roja de la verde, en el formulario, la ficha, la lista, la caja y Diseños.']],
 ['1.0.2',['Al añadir o editar una pieza, el **coste se calcula solo** con los gramos y el precio por kg de tu filamento, más la luz, el desgaste de la impresora y los fallos. Si lo prefieres, puedes escribirlo a mano.',
  'Una pieza puede tener **varios colores o materiales** (por ejemplo a dos colores con el AMS), cada uno con sus gramos. El coste los suma todos.',
  'Te propone un **precio de venta** con tu margen, y al registrar una impresión descuenta cada color de su bobina.']],
 ['1.0.1',['La **calculadora lee archivos STEP** (Fusion 360, SolidWorks, Onshape…): medidas, volumen y estimación de gramos y horas.',
  'Las **X1 y P1 con AMS** ya muestran los colores de cada hueco en la granja.']],
 ['1.0.0',['Primera versión: panel, ventas con lector QR, tickets, piezas y stock con foto, diseños, filamentos, movimientos, calculadora con STL/3MF y presupuestos.',
  'Clientes, colaboradores, gastos, servicio informático con categorías y precio habitual, y usuarios con permisos.',
  '**Granja de impresoras** (opcional, en Ajustes): QR por impresora y control en directo de las Bambu Lab en modo LAN.',
  '**Cambiar de usuario** con un toque, **foto de cada impresora** y **boquillas** 0,2 / 0,4 / 0,6 / 0,8 con su tipo.',
  'Las tarjetas de resumen (ingresos, gastos, beneficio, piezas…) se pueden tocar para entrar.']]];
const newer=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++)if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0);return false};
/* Idioma: español (España) o inglés. Los textos se traducen en i18n.js; todo texto nuevo necesita su traducción allí. */
const langTabs=()=>`<div class="tabs" translate="no" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es" class="${T3D_LANG==='es'?'on':''}">🇪🇸 Español</button><button type="button" data-lang="en" class="${T3D_LANG==='en'?'on':''}">🇬🇧 English</button></div>`;
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-lang]');if(b){e.preventDefault();setLang(b.dataset.lang)}});
{const lc=document.getElementById('langchip');if(lc){const o=T3D_LANG==='en'?'es':'en';lc.textContent=T3D_LANG==='en'?'EN':'ES';lc.dataset.lang=o;lc.dataset.tip=T3D_LANG==='en'?'Language: English · Cambiar a español':'Idioma: español · Switch to English';lc.setAttribute('aria-label',T3D_LANG==='en'?'Cambiar a español':'Switch to English')}}
const mdl=t=>esc(T(t)).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function showNews(since){const l=(since?NEWS.filter(([v])=>newer(v,since)):NEWS.slice()).sort((a,b)=>newer(a[0],b[0])?-1:newer(b[0],a[0])?1:0);if(!l.length)return;
 modal(`<div class="ch" style="margin:0"><h2>${since?'Taller3D Panel se ha actualizado a la '+esc(webVer()):'Novedades de Taller3D Panel'}</h2><button class="btn gh" data-close>Cerrar</button></div>
 <div class="news">${l.map(([v,it])=>`<h3>Versión ${esc(v)}${v===webVer()?' <span class="tag">la tuya</span>':''}</h3><ul>${it.map(i=>`<li>${mdl(i)}</li>`).join('')}</ul>`).join('')}</div>
 <p class="note" style="margin:0">Web ${esc(webVer())} · ${appVersion()?'App Android '+esc(appVersion()):`<a href="${APK_URL}" target="_blank" rel="noopener">Descargar la app Android</a>`}</p>
 <button type="button" class="btn newsup" id="newsup" title="Volver arriba del todo" aria-label="Volver arriba del todo">↑ Volver arriba</button>`);
 const d=$('#dlg'),up=$('#newsup'),top=()=>{d.scrollTop=0};top();requestAnimationFrame(top);setTimeout(top,80);
 const chk=()=>{if(!up.isConnected){d.removeEventListener('scroll',chk);return}up.classList.toggle('on',d.scrollTop>250)};d.addEventListener('scroll',chk,{passive:true});
 up.onclick=()=>{try{d.scrollTo({top:0,behavior:'smooth'})}catch(e){top()}}}
/* Versión nueva en el servidor. La web instalada como app (acceso directo de Chrome/Edge o del móvil) se abre en una
   ventana sin barra ni botón de recargar, y si se queda abierta sigue con la versión vieja. Por eso se pregunta a
   api/version al abrir, cada 5 minutos y al volver a la ventana; si el servidor tiene otra más nueva, sale un aviso
   con «Actualizar», que borra lo guardado (cachés y service workers, si los hubiera) y recarga. */
let upSkip='',upLast=0;
async function srvVersion(){const r=await fetch('api/version?t='+Date.now(),{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw 0;return String((await r.json()).version||'')}
function hardReload(){const go=()=>{const u=new URL(location.href);u.searchParams.set('r',Date.now().toString(36));location.replace(u.toString())},w=[];
 try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)w.push(navigator.serviceWorker.getRegistrations().then(l=>Promise.all(l.map(x=>x.unregister()))))}catch(e){}
 try{if(window.caches&&caches.keys)w.push(caches.keys().then(k=>Promise.all(k.map(n=>caches.delete(n)))))}catch(e){}
 Promise.race([Promise.all(w),new Promise(ok=>setTimeout(ok,1500))]).catch(()=>{}).then(go)}
function upBar(v){let b=document.getElementById('upbar');if(!b){b=document.createElement('div');b.id='upbar';b.className='upbar';b.setAttribute('role','status');document.body.appendChild(b)}
 b.innerHTML=`<span class="upt"><b>Hay una versión nueva</b><span>Tienes la ${esc(WEB_VERSION)} y ya está la ${esc(v)}.</span></span><button type="button" class="btn" id="upgo">Actualizar</button><button type="button" class="ib" id="upno" title="Ahora no" aria-label="Ahora no">✕</button>`;
 b.querySelector('#upgo').onclick=()=>{b.querySelector('#upgo').classList.add('busy');try{sessionStorage.setItem('t3d-recarga','1')}catch(e){}hardReload()};
 b.querySelector('#upno').onclick=()=>{upSkip=v;b.remove()}}
async function checkUp(force){if(IN_ARTIFACT||DEMO)return;const now=Date.now();if(!force&&now-upLast<60000)return;upLast=now;
 let v='';try{v=await srvVersion()}catch(e){return}if(v&&newer(v,WEB_VERSION)&&v!==upSkip)upBar(v)}
function reloadNow(){toast('Recargando…');try{sessionStorage.setItem('t3d-recarga','1')}catch(e){}setTimeout(hardReload,300)}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-reload]');if(b){e.preventDefault();reloadNow()}});
if(!IN_ARTIFACT&&!DEMO){setTimeout(()=>checkUp(true),4000);setInterval(()=>checkUp(true),5*60000);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUp()});window.addEventListener('focus',()=>checkUp());window.addEventListener('online',()=>checkUp(true));
 try{if(sessionStorage.getItem('t3d-recarga')){sessionStorage.removeItem('t3d-recarga');const u=new URL(location.href);if(u.searchParams.has('r')){u.searchParams.delete('r');history.replaceState(history.state,'',u.toString())}

function searchAll(q){q=q.toLowerCase().trim();if(!q)return [];const r=[];
 PAGES.forEach(([k,l])=>l.toLowerCase().includes(q)&&r.push({t:'Página',l,a:()=>go(k)}));
 S.products.forEach(p=>[p.name,p.code].some(v=>String(v||'').toLowerCase().includes(q))&&r.push({t:p.estado==='listo'||!p.estado?num(p.stock)+' ud':'Diseño',l:p.name,a:()=>showProduct(p.id)}));
 S.customers.forEach(c=>c.name.toLowerCase().includes(q)&&r.push({t:'Cliente',l:c.name,a:()=>editCustomer(c.id)}));
 S.collabs.forEach(c=>c.name.toLowerCase().includes(q)&&r.push({t:'Colaborador',l:c.name,a:()=>editCollab(c.id)}));
 S.sales.forEach(s=>(tnum(s.num).includes(q)||String(s.num)===q)&&r.push({t:money(s.total),l:'Ticket '+tnum(s.num),a:()=>receiptModal(s)}));
 S.jobs.forEach(j=>[jnum(j.num),j.type,j.customerName,j.brand].some(v=>String(v||'').toLowerCase().includes(q))&&r.push({t:'Servicio '+jnum(j.num),l:j.type+(j.customerName?' · '+j.customerName:''),a:()=>editJob(j.id)}));
 S.quotes.forEach(x=>[qnum(x.num),x.title,x.customerName].some(v=>String(v||'').toLowerCase().includes(q))&&r.push({t:'Presupuesto',l:qnum(x.num)+' '+(x.title||''),a:()=>viewQuote(x.id)}));
 S.spools.forEach(s=>[s.brand,s.line,s.color,s.material].join(' ').toLowerCase().includes(q)&&r.push({t:num(s.left)+' g',l:[s.brand,s.line||s.material,s.color].filter(Boolean).join(' '),a:()=>editSpool(s.id)}));
 return r.slice(0,10)}

 else if(d.tk){S.tksel=d.tk;if(matchMedia('(max-width:860px)').matches){const s=S.sales.find(x=>x.id===d.tk);if(s)receiptModal(s)}else render()}
 else if(d.tkm){const s=S.sales.find(x=>x.id===d.tkm);if(s)receiptModal(s)}
 else if('sdnow' in d){S.sdate='';S.sstock=false;render()}
 else if(d.prt)tkPrint(d.prt);else if(d.prtc)tkPrintModal(d.prtc);
 else if(d.dlt){const s=S.sales.find(x=>x.id===d.dlt);if(s)saveFile('ticket-'+String(s.num).padStart(4,'0')+'.html',receiptFile(s),'text/html')}
 else if(d.cpt){const s=S.sales.find(x=>x.id===d.cpt);if(s)navigator.clipboard.writeText(TL(receiptText(s))).then(()=>toast('Ticket copiado'),()=>toast('No se pudo copiar'))}
 else if(d.anul)anular(d.anul);else if(d.edtk)editTicket(d.edtk);
 else if(d.ec)editCustomer(d.ec);else if(d.eb)editCollab(d.eb);else if(d.eg)editExpense(d.eg);
 else if(d.th){if(d.th!==(isDark()?'dark':'light'))toggleTheme()}
 else if(d.payt)payTicket(d.payt);else if(d.tkf){S.tkf=d.tkf;render()}else if(d.ig)igPost(d.ig);else if(d.lab1){const [a,b]=d.lab1.split(':');labelModal(a,b.slice(0))}
 else if(d.pr)editPrinter(d.pr);else if(d.prcalc){S.calc={...(S.calc||calcDefaults()),printer:d.prcalc};go('presupuestos')}else if(d.ej){closeModal();editJob(d.ej)}else if(d.jr)jobReceiptModal(d.jr);else if(d.jobf){S.jobf=d.jobf;render()}else if(d.jcat){S.jcat=d.jcat;render()}
 else if(d.qtab){S.qtab=d.qtab;render()}else if(d.vq)viewQuote(d.vq);else if(d.garea){S.garea=d.garea;render()}
 else if(d.farmon!=null){saveCfg({farmOn:d.farmon==='1'}).then(()=>toast(d.farmon==='1'?'Granja activada: la tienes en el menú «Taller»':'Granja desactivada')).catch(()=>{})}
 else if(d.swu)switchUser(d.swu);
 else if(d.kdone)kDone(d.kdone);else if(d.kfail)kFail(d.kfail);else if(d.kasg)kAssign(d.kasg);else if(d.kqp)kAssign(null,d.kqp);else if(d.kpick){const [a,b]=d.kpick.split('|');kStart(a,b)}
 else if(d.kqd){const q=S.queue.find(x=>x.id===d.kqd);if(q)confirmBox('¿Quitar «'+q.name+'» de la cola?',()=>del('queue',q.id))}
 else if(d.kfree)patch('farm',d.kfree,{status:'libre'}).then(()=>farmLog(d.kfree,'status',{status:'libre'}));
 else if(d.fm)farmDetail(d.fm);else if(d.fmr)farmDetail(d.fmr);else if(d.efm)editFarm(d.efm);else if(d.fmf){S.fmf=d.fmf;render()}
 else if(d.fms){const id=S.fmOpen;farmLog(id,'status',{status:d.fms});patch('farm',id,{status:d.fms,...(d.fms!=='imprimiendo'?{}:{since:Date.now()})}).then(()=>farmDetail(id)).catch(()=>{})}
 else if(d.fmc)farmCmd(S.fmOpen,d.fmc,d.fmv!=null?+d.fmv:undefined);
 else if(d.eu){if(IN_ARTIFACT){const u=S.appusers.find(x=>x.id===d.eu);if(u)editUser(pubLocal(u))}else api('GET','api/users').then(l=>{const u=l.find(x=>x.id===d.eu);if(u)editUser(u)}).catch(()=>{})}
 else if(CSV[t.id]){const [n,c]=CSV[t.id]();saveFile(n,c,'text/csv')}
 else switch(t.id){
  case 'clr':S.cart=[];S.cash='';syncCart();break;case 'cobrar':cobrar();break;
  case 'newp':editProduct('');break;case 'newr':editResale('');break;case 'newd':editProduct('',{estado:'idea',stock:0,code:''});break;case 'labels':labelsSheet();break;
  case 'newsp':editSpool('');break;case 'newc':editCustomer('');break;case 'newb':editCollab('');break;case 'newg':editExpense('');break;
  case 'bmore':moreSheet();break;case 'newfm':editFarm('');break;case 'kgo':kioskEnter();break;case 'bcloud':cloudModal();break;case 'kexit':kioskExit();break;case 'kq':case 'kq2':kQueueAdd();break;case 'kseed':kioskSeed();break;case 'fmnot':Notification.requestPermission().then(p=>{toast(p==='granted'?'Te avisaré cuando una impresora termine o falle (con la web abierta)':'El navegador no ha dado permiso para avisos');render()});break;case 'bulkfm':bulkFarm();break;case 'fmlab':farmLabels();break;
  case 'quickp':quickPiece();break;case 'quickc':case 'quickc2':quickClient();break;case 'camscan':cameraScan(v=>handleScan(v));break;
  case 'newj':editJob('');break;case 'newq':editQuote('');break;case 'scansp':scanSpool();break;case 'addpr':case 'addpr2':pickPrinter();break;case 'nologo':saveCfg({logo:''});break;
  case 'c2q':{const c=calcRead(),r=calcCompute(c);editQuote('',{title:c.name||'',lines:[{d:(c.name||'Pieza impresa en 3D'),q:c.qty,u:+r.price.toFixed(2)}]});break}
  case 'c2p':calcRead();applyToPiece();break;case 'c2s':{const c=calcRead();saveCfg({kwh:c.kwh,labor:c.laborRate,margin:c.margin,fail:c.fail}).then(()=>toast('Valores guardados por defecto'));break}
  case 'newu':editUser(null);break;case 'logout':if(IN_ARTIFACT){const cu=sessGet();if(cu)accsSet(accsGet().filter(a=>a.uid!==cu.uid));sessSet(null);ME=null;closeModal();$('#login').dataset.mode='login';showLogin();break}api('POST','api/logout').catch(()=>{}).then(()=>location.reload());break;
  case 'recnew':recNew();break;
  case 'chpw':modal(`<h2>Cambiar contraseña</h2><form id="fpw" style="display:grid;gap:12px"><label>Contraseña actual<input name="old" type="password" required autocomplete="current-password"></label><label>Nueva contraseña<input name="pw" type="password" minlength="4" required autocomplete="new-password"></label><div class="acts"><button type="button" class="btn gh" data-close>Cancelar</button><button class="btn">Cambiar</button></div></form>`);$('#fpw').onsubmit=async ev=>{ev.preventDefault();const f=ev.target;try{if(IN_ARTIFACT){const u=S.appusers.find(x=>x.id===ME.id);if(!u||await pbk(f.old.value,u.salt)!==u.hash)throw {message:'La contraseña actual no es correcta'};if(f.pw.value.length<4)throw {message:'Mínimo 4 caracteres'};const salt=rhex(16),hash=await pbk(f.pw.value,salt);await patch('appusers',u.id,{salt,hash});sessSet({uid:u.id,h:hash.slice(0,16)});closeModal();toast('Contraseña cambiada');return}await api('POST','api/password',{old:f.old.value,password:f.pw.value});closeModal();toast('Contraseña cambiada')}catch(err){toast(err.message||'No se pudo cambiar')}};break;case 'mth':closeModal();toggleTheme();break;
  case 'delej':confirmBox('Se borrarán solo los registros de ejemplo. Lo que hayas creado tú se queda.',async()=>{for(const k of ['sales','moves','prints','expenses','jobs','quotes','products','customers','collabs','spools'])for(const x of S[k].filter(x=>/^ej/.test(x.id)))await del(k,x.id);toast('Datos de ejemplo borrados')});break;
 }
});
const h=location.hash.slice(1);if(V[h])S.view=h;else if(/^granja\/IMP-\d+$/i.test(h)){S.view='granja';S.pendingFarm=h.slice(7)}
try{if(localStorage.getItem('t3d-kiosk')==='1'&&!location.hash.slice(1))S.view='taller'}catch(e){}
try{history.replaceState({v:S.view,d:0},'','#'+S.view)}catch(e){}
doRender();

/* ======================= BASE DE DATOS ======================= */
function subscribeAll(){
 const timer=setTimeout(()=>{if(!live)status(false,'Sin conexión todavía…')},10000);
 const ok=snap=>{if(!snap.metadata.fromCache&&!live){live=true;clearTimeout(timer);status(true,IN_ARTIFACT?'Todo guardado en la nube':'Guardado en tu servidor')}else if(!snap.metadata.fromCache)clearTimeout(timer)};
 const fail=()=>{clearTimeout(timer);status(false,'Error de conexión')};
 const sub=(col,q)=>q.onSnapshot(snap=>{S[col]=snap.docs.map(d=>({id:d.id,...d.data()}));if(col==='farmlog')farmNotify();ok(snap);if(col==='farm'&&S.pendingFarm){const pf=farmFromCode(S.pendingFarm);if(pf){S.pendingFarm='';setTimeout(()=>farmDetail(pf.id),50)}}if(col==='products')S.cart=S.cart.filter(l=>l.custom||S.products.some(p=>p.id===l.id));render()},fail);
 if(IN_ARTIFACT)db.collection('appusers').onSnapshot(snap=>{if(snap.metadata.fromCache&&snap.empty&&!authReady)return;S.appusers=snap.docs.map(d=>({id:d.id,...d.data()}));checkLocalAuth()},()=>{authReady=true;$('#login').hidden=true});
 ['products','customers','collabs','spools','quotes','profiles','farm','queue'].forEach(c=>sub(c,db.collection(c)));
 ['sales','expenses','prints','moves','jobs','farmlog'].forEach(c=>sub(c,db.collection(c).orderBy('date','desc').limit(1000)));
 db.doc('config/main').onSnapshot(s=>{window.__cfgLoaded=true;if(s.exists){const d=s.data()||{};S.cfg={...S.cfg,...d,printers:Array.isArray(d.printers)&&d.printers.length?d.printers.map(String):S.cfg.printers};_fmt=null;render()}},()=>{});
}
(async()=>{
 if(!IN_ARTIFACT){initServer();return}
 {const l=$('#login');l.hidden=false;l.dataset.mode='loading';l.innerHTML='<div class="empty">Cargando…</div>'}
 try{db=await claude.use('db')}catch(e){db=null}
 if(!db){status(false,'Sin base de datos: los cambios no se guardan');$('#login').hidden=true;return}
 setTimeout(()=>{if(!authReady){authReady=true;$('#login').hidden=true;toast('No se pudo comprobar el usuario: sin conexión')}},12000);
 subscribeAll();
})();
}
